    const DOCS = [{"id": "00-dashboard", "title": "🎯 Dashboard e Visão Geral", "category": "Planejamento", "fileName": "00 - Dashboard.md", "content": "---\ntags:\n  - concurso\n  - sema-mt\n  - engenharia-civil\n  - 2026\n---\n# 🎯 Concurso SEMA/MT 2026 — Engenheiro Civil\n\n## Resumo Rápido\n- **Cargo:** Analista de Meio Ambiente - Perfil 5: Engenharia Civil\n- **Remuneração:** R$ 10.491,97\n- **Banca:** Cesgranrio\n- **Vagas:** Cadastro de Reserva\n- **Jornada:** 40h\n- **Inscrição:** R$ 150,00\n- **Local da Prova:** Cuiabá/MT\n- **Data da Prova:** 13/12/2026\n\n## Estrutura da Prova\n\n| Disciplina | Questões | Pontos | Peso | Nota Mínima |\n| :--- | :--- | :--- | :--- | :--- |\n| Língua Portuguesa | 15 | 15 | 1 | N/A* |\n| Geografia/História MT | 10 | 10 | 1 | N/A* |\n| Ética/Filosofia/Atualidades/Legislação | 5 | 5 | 1 | N/A* |\n| Conhecimentos Específicos | 40 | 40 | 1 | N/A* |\n| Prova Discursiva | 1 | 10 | - | 6,0 (60%) |\n| **Total** | **71** | **80 máximo** | - | **42 (Obj) + 6,0 (Disc)** |\n\n> [!WARNING]\n> * **Nota mínima:** 42 pts na objetiva (60%) + 6,0 na discursiva (60%). **É obrigatório NÃO zerar nenhuma disciplina.**\n\n## Navegação do Vault\n- [[01 - Fluxo de Estudo]]\n- [[02 - Cronograma Oficial]]\n\n## Progresso de Estudo\n- [ ] Língua Portuguesa\n- [ ] Geografia/História MT\n- [ ] Ética/Filosofia/Atualidades/Legislação\n- [ ] Conhecimentos Específicos\n- [ ] Prova Discursiva\n"}, {"id": "01-fluxo", "title": "📋 Fluxo de Estudo Completo", "category": "Planejamento", "fileName": "01 - Fluxo de Estudo.md", "content": "---\ntags:\n  - fluxo\n  - estrategia\n  - planejamento\n---\n# 📋 Fluxo de Estudo — Plano Completo\n\n## Diagrama de Fluxo\n\n```mermaid\nflowchart TD\n    A[\"FASE 1 (Semanas 1-3) Base Legal + Língua Portuguesa\"] --> B[\"FASE 2 (Semanas 4-6) Conhecimentos Gerais (Geo/História MT + Ética)\"]\n    B --> C[\"FASE 3 (Semanas 7-12) Conhecimentos Específicos Transversais (Legislação Ambiental)\"]\n    C --> D[\"FASE 4 (Semanas 7-14) Conhecimentos Específicos Direcionados (Engenharia Civil pura)\"]\n    D --> E[\"FASE 5 (Semana 13-14) Revisão Final + Simulados + Discursiva\"]\n```\n\n## Detalhamento das Fases\n\n### FASE 1 (Semanas 1-3): Base Legal + Língua Portuguesa\n- **Objetivo da fase:** Construir base sólida na língua nativa e no entendimento inicial das leis.\n- **Matérias a estudar:** [[Língua Portuguesa]], Legislação inicial.\n- **Carga horária sugerida:** 15h a 20h / semana.\n- **Estratégia de estudo:** Leitura ativa da teoria, resolução massiva de questões da Cesgranrio.\n- **Marcos de validação:** Mini-simulados semanais de Português (meta: >80% de acerto).\n\n### FASE 2 (Semanas 4-6): Conhecimentos Gerais (Geo/História MT + Ética)\n- **Objetivo da fase:** Dominar o contexto regional e regras éticas.\n- **Matérias a estudar:** [[Geografia/História MT]], [[Ética/Filosofia/Atualidades/Legislação]].\n- **Carga horária sugerida:** 15h a 20h / semana.\n- **Estratégia de estudo:** Criação de mapas mentais, leitura focada.\n- **Marcos de validação:** Resolução de questões históricas e de concursos regionais.\n\n### FASE 3 (Semanas 7-12): Conhecimentos Específicos Transversais (Legislação Ambiental)\n- **Objetivo da fase:** Compreender todo o arcabouço jurídico ambiental essencial para o cargo.\n- **Matérias a estudar:** [[Conhecimentos Específicos]] (Legislação).\n- **Carga horária sugerida:** 25h / semana.\n- **Estratégia de estudo:** Leitura da lei seca, resumos e flashcards (Spaced Repetition).\n- **Marcos de validação:** Exercícios simulando casos práticos, >75% de acertos.\n\n### FASE 4 (Semanas 7-14): Conhecimentos Específicos Direcionados (Engenharia Civil pura)\n- **Objetivo da fase:** Aprofundar nos temas técnicos da Engenharia Civil.\n- **Matérias a estudar:** [[Conhecimentos Específicos]] (Engenharia Civil).\n- **Carga horária sugerida:** 25h / semana (em paralelo com Fase 3).\n- **Estratégia de estudo:** Resolução de questões de cálculo, leitura de normas técnicas (ABNT).\n- **Marcos de validação:** Simulado técnico, % de acerto esperado de 70-80%.\n\n### FASE 5 (Semana 13-14): Revisão Final + Simulados + Discursiva\n- **Objetivo da fase:** Consolidação do conhecimento e treino de tempo de prova.\n- **Matérias a estudar:** Revisão geral de todas as matérias e [[Prova Discursiva]].\n- **Carga horária sugerida:** 30h / semana.\n- **Estratégia de estudo:** Simulados completos e redação com cronômetro.\n- **Marcos de validação:** Simulado completo > 45 pts (Objetiva), Discursiva estruturada.\n\n## Estratégia de Estudo por Peso\n- **Conhecimentos Específicos:** 40 questões (57% da prova) → dedicar ~50-55% do tempo.\n- **Língua Portuguesa:** 15 questões (21%) → dedicar ~15% do tempo.\n- **Geo/História MT:** 10 questões (14%) → dedicar ~15% do tempo.\n- **Ética/Legislação:** 5 questões (7%) → dedicar ~10% do tempo.\n- **Discursiva:** (10 pts separados) → treinar 1 redação/semana a partir da semana 6.\n\n## Ciclo Semanal de Estudo\n\n| Dia da Semana | Matéria 1 | Matéria 2 | Extra |\n| :--- | :--- | :--- | :--- |\n| Segunda | Conhecimentos Específicos | Língua Portuguesa | Flashcards |\n| Terça | Conhecimentos Específicos | Geo/História MT | Exercícios |\n| Quarta | Conhecimentos Específicos | Ética/Legislação | Leitura de Lei |\n| Quinta | Conhecimentos Específicos | Língua Portuguesa | Exercícios |\n| Sexta | Revisão da Semana | Conhecimentos Específicos | Simulados parciais |\n| Sábado | Discursiva | Geo/História MT | Correção e Resumo |\n| Domingo | Descanso / Simulado Geral | | |\n\n## Técnicas de Estudo Recomendadas\n- **Pomodoro:** Blocos de 25-50 min de foco total.\n- **Active Recall:** Tentar lembrar do conteúdo sem ler antes.\n- **Spaced Repetition:** Revisões em intervalos crescentes.\n- **Mapas Mentais:** Para visualização de tópicos de Geo/História e Leis.\n\n> [!WARNING]\n> É obrigatório obter no mínimo 42 pontos na prova objetiva e não zerar nenhuma disciplina. Dê atenção a todas as matérias!\n\n> [!TIP]\n> A prova discursiva tem peso importantíssimo como critério de desempate e aprovação (mínimo de 6,0 pontos). Treine a escrita!\n"}, {"id": "02-cronograma", "title": "📅 Cronograma Oficial", "category": "Planejamento", "fileName": "02 - Cronograma Oficial.md", "content": "---\ntags:\n  - cronograma\n  - datas\n---\n# 📅 Cronograma Oficial do Concurso\n\n## Tabela de Datas\n\n| Evento | Data |\n| :--- | :--- |\n| Inscrições | 17/09/2026 a 14/10/2026 |\n| Isenção | 17/09 a 24/09/2026 |\n| Resultado Isenção | 30/09/2026 |\n| Resultado Final Isenção | 09/10/2026 |\n| Inscrições Deferidas (preliminar) | 22/10/2026 |\n| Inscrições Deferidas (final) | 30/10/2026 |\n| Cartão de Confirmação | 08/12/2026 |\n| PROVA | 13/12/2026 (5 horas) |\n| Gabaritos Preliminares | 14/12/2026 |\n| Recursos Gabarito | 14-15/12/2026 |\n| Cartão-Resposta | 22/01/2027 |\n| Resultado Objetiva + Discursiva | 28/01/2027 |\n| Revisão Discursiva | 28-29/01/2027 |\n| Resultado Final | 27/03/2027 |\n| Validade | 2 anos (prorrogável por +2) |\n\n## Contagem Regressiva\nFaltam **102 dias** para a prova (13/12/2026). *(A data atual é 02/09/2026)*\n\n> [!IMPORTANT]\n> Acompanhe rigorosamente o período de **Inscrições (17/09/2026 a 14/10/2026)** e a data da **PROVA (13/12/2026)**.\n"}, {"id": "03-portugues", "title": "📝 Língua Portuguesa", "category": "Conhecimentos Básicos", "fileName": "03 - Língua Portuguesa.md", "content": "---\ntags: [portugues, basico, 15-questoes]\n---\n# 📝 Língua Portuguesa (15 questões | 15 pontos)\n\n> [!IMPORTANT]\n> Você não pode zerar esta disciplina! Uma base sólida em Língua Portuguesa é essencial para a aprovação.\n\n## 1. Compreensão e interpretação de textos\n- **Resumo Teórico:** Compreensão refere-se ao que está escrito (dados explícitos). Interpretação refere-se ao que se deduz do texto (implícitos).\n- **Dicas Cesgranrio:** A banca gosta de textos densos (artigos de opinião, crônicas). Leia o comando da questão antes do texto.\n- **Pontos-chave:**\n  - Diferencie informação explícita de inferência.\n  - Atenção ao vocabulário.\n  - Identifique o tema central e a intenção do autor.\n\n## 2. Argumentação e persuasão\n- **Resumo Teórico:** Argumentação visa convencer o leitor. Utiliza-se de dados, exemplos, autoridades e raciocínio lógico. Falácias são erros de raciocínio.\n- **Dicas Cesgranrio:** Cuidado com questões que pedem para identificar o argumento principal ou classificar a falácia.\n- **Pontos-chave:**\n  - Tipos de arguments (autoridade, evidência, princípio).\n  - Estrutura: tese, desenvolvimento, conclusão.\n  - Reconhecimento de falácias comuns.\n\n## 3. Comunicação assertiva\n- **Resumo Teórico:** Uso de linguagem clara, objetiva, livre de ambiguidades e jargões desnecessários, adequada ao contexto corporativo e oficial.\n- **Dicas Cesgranrio:** Foco em questões que pedem reescrita de frases para torná-las mais diretas e sem ruídos.\n- **Pontos-chave:**\n  - Linguagem simples.\n  - Concisão (evitar prolixidade).\n  - Objetividade.\n\n## 4. Organização textual\n- **Resumo Teórico:** Estrutura em parágrafos que dividem introdução, desenvolvimento e conclusão.\n- **Dicas Cesgranrio:** Questões sobre a função de um parágrafo específico ou a ordem lógica dos períodos.\n- **Pontos-chave:**\n  - Tópico frasal.\n  - Desenvolvimento da ideia.\n  - Paragrafação adequada.\n\n## 5. Coesão e coerência\n- **Resumo Teórico:** Coesão é a ligação gramatical (pronomes, conjunções). Coerência é a lógica de sentido.\n- **Dicas Cesgranrio:** Troca de conjunções (causa, concessão, oposição) é muito cobrada!\n- **Pontos-chave:**\n  - Elementos anafóricos e catafóricos.\n  - Conjunções coordenativas e subordinativas.\n  - Manutenção do sentido.\n\n## 6. Tipologia textual\n- **Resumo Teórico:** Diferença entre narração (fatos), descrição (características), dissertação (argumentação/exposição) e injunção (ordens).\n- **Dicas Cesgranrio:** Identificação da tipologia predominante e secundária em textos híbridos.\n- **Pontos-chave:**\n  - Injunção: manuais, receitas.\n  - Exposição: informar sem opinar.\n  - Dissertação: defender ponto de vista.\n\n## 7. Ortografia oficial\n- **Resumo Teórico:** Uso correto de letras (s/z, x/ch, j/g) e formas variantes.\n- **Dicas Cesgranrio:** Uso do \"porquê\", mal/mau, onde/aonde, acerca de / a cerca de.\n- **Pontos-chave:**\n  - Regras do X e CH.\n  - Uso dos porquês.\n  - Palavras homônimas parônimas.\n\n## 8. Acentuação gráfica\n- **Resumo Teórico:** Regras baseadas na tonicidade: oxítonas, paroxítonas e proparoxítonas.\n- **Dicas Cesgranrio:** A banca foca nas exceções e regras do Novo Acordo (ditongos abertos e hiatos).\n- **Pontos-chave:**\n  - Todas proparoxítonas são acentuadas.\n  - Acentuação de oxítonas e paroxítonas.\n  - Regras dos hiatos (i e u tônicos).\n\n## 9. Crase\n- **Resumo Teórico:** Fusão da preposição 'a' com o artigo 'a' ou pronome demonstrativo.\n- **Dicas Cesgranrio:** Troque a palavra feminina por masculina; se virar \"ao\", tem crase.\n- **Pontos-chave:**\n  - Obrigatória: locuções femininas.\n  - Proibida: antes de verbos e palavras masculinas.\n  - Facultativa: pronomes possessivos femininos, nomes próprios femininos, até a.\n\n## 10. Sintaxe da oração e do período\n- **Resumo Teórico:** Análise dos termos essenciais (sujeito, predicado), integrantes e acessórios. Período simples e composto (coordenação e subordinação).\n- **Dicas Cesgranrio:** Identificação de sujeito (oculto, indeterminado, oracional) e função sintática do \"que\" e \"se\".\n- **Pontos-chave:**\n  - Tipos de sujeito.\n  - Vozes verbais.\n  - Orações subordinadas adjetivas e substantivas.\n\n## 11. Pontuação\n- **Resumo Teórico:** Uso de sinais de pontuação para organizar o raciocínio. A vírgula é o mais cobrado.\n- **Dicas Cesgranrio:** Nunca se separa sujeito do verbo, nem verbo do complemento com vírgula.\n- **Pontos-chave:**\n  - Vírgula em adjunto adverbial deslocado.\n  - Uso do travessão para isolar aposto.\n  - Ponto e vírgula em enumerações.\n\n## 12. Concordância nominal e verbal\n- **Resumo Teórico:** Ajuste de flexão entre termos. Verbal (verbo e sujeito) e Nominal (nome e determinantes).\n- **Dicas Cesgranrio:** Casos do verbo haver (impessoal) e fazer (tempo).\n- **Pontos-chave:**\n  - Verbo \"haver\" no sentido de existir = singular.\n  - Sujeito composto posposto.\n  - Concordância com expressões partitivas.\n\n## 13. Regência nominal e verbal\n- **Resumo Teórico:** Relação de dependência entre as palavras e seus complementos (com ou sem preposição).\n- **Dicas Cesgranrio:** Verbos clássicos: assistir, visar, preferir, aspirar.\n- **Pontos-chave:**\n  - Assistir (ver = a, ajudar = sem prep).\n  - Visar (almejar = a, mirar = sem prep).\n  - Preferir algo a outra coisa.\n\n## 14. Significação das palavras\n- **Resumo Teórico:** Sentido das palavras no contexto. Sinônimos, antônimos, parônimos (parecidos) e homônimos (iguais). Polissemia (vários sentidos).\n- **Dicas Cesgranrio:** Questões de reescrita pedindo sinônimos perfeitos no contexto.\n- **Pontos-chave:**\n  - Diferença parônimos/homônimos.\n  - Polissemia vs ambiguidade.\n  - Vocabulário erudito básico.\n\n## 15. Colocação pronominal\n- **Resumo Teórico:** Posição do pronome oblíquo átono em relação ao verbo: próclise (antes), mesóclise (meio), ênclise (depois).\n- **Dicas Cesgranrio:** Palavras atrativas (negativas, advérbios, pronomes relativos) exigem próclise.\n- **Pontos-chave:**\n  - Nunca começar frase com pronome oblíquo átono.\n  - Mesóclise só em futuro do presente/pretérito sem palavra atrativa.\n  - Principais atratores de próclise.\n\n## 16. Redação Oficial\n- **Resumo Teórico:** Normas do Manual de Redação da Presidência da República (3ª edição).\n- **Dicas Cesgranrio:** Padrão Ofício (extinção de memorando e aviso), pronomes de tratamento.\n- **Pontos-chave:**\n  - Atributos da redação oficial (impessoalidade, clareza, concisão).\n  - Vocativo e fecho corretos (Respeitosamente / Atenciosamente).\n  - Estrutura do Padrão Ofício.\n\n## 17. Novo Acordo Ortográfico\n- **Resumo Teórico:** Mudanças na acentuação e no uso do hífen.\n- **Dicas Cesgranrio:** Foco no fim do acento em ditongos abertos (ei, oi) nas paroxítonas (ex: ideia, jiboia).\n- **Pontos-chave:**\n  - Hífen com prefixos.\n  - Vogais iguais separam, vogais diferentes juntam.\n  - Fim do trema.\n\n## Material de Referência\n- **Livros:** Gramática para Concursos (Pestana)\n- **Sites:** QConcursos (filtre por Cesgranrio), YouTube (Canais de professores como Flávia Rita, Elias Santana)\n\n## Checklist de Revisão\n- [ ] Compreensão e interpretação de textos\n- [ ] Argumentação e persuasão\n- [ ] Comunicação assertiva\n- [ ] Organização textual\n- [ ] Coesão e coerência\n- [ ] Tipologia textual\n- [ ] Ortografia oficial\n- [ ] Acentuação gráfica\n- [ ] Crase\n- [ ] Sintaxe da oração e do período\n- [ ] Pontuação\n- [ ] Concordância nominal e verbal\n- [ ] Regência nominal e verbal\n- [ ] Significação das palavras\n- [ ] Colocação pronominal\n- [ ] Redação Oficial\n- [ ] Novo Acordo Ortográfico\n"}, {"id": "04-geografia-historia-mt", "title": "🗺️ Geografia e História de MT", "category": "Conhecimentos Gerais", "fileName": "04 - Geografia e História de MT.md", "content": "---\ntags: [geografia, historia, mato-grosso, 10-questoes]\n---\n# 🗺️ Geografia e História Política e Econômica de MT (10 questões | 10 pontos)\n\n> [!IMPORTANT]\n> Você não pode zerar esta disciplina! Por ser matéria regional, muitos candidatos têm dificuldade. Faça a diferença aqui!\n\n## PARTE 1: GEOGRAFIA DE MT\n\n### 1. Produção do espaço regional\n- **Resumo Teórico:** Formação ligada aos ciclos econômicos (mineração, borracha, pecuária) culminando na moderna expansão agropecuária e consolidação da fronteira agrícola.\n- **Dicas Cesgranrio:** Relacione a infraestrutura de transportes (BR-163) com o escoamento da soja.\n- **Pontos-chave:**\n  - Marcha para o Oeste (década de 1940).\n  - Expansão agrícola a partir dos anos 70/80 (soja).\n  - Agronegócio como motor econômico e suas dinâmicas socioespaciais.\n\n### 2. Aspectos naturais\n- **Resumo Teórico:** Clima tropical continental (duas estações bem definidas). Relevo diversificado. MT é único por possuir três biomas.\n- **Dicas Cesgranrio:** Localize os biomas no mapa estadual (Norte: Amazônia, Centro/Sul/Leste: Cerrado, Sudoeste: Pantanal).\n- **Pontos-chave:**\n  - **Clima:** Tropical e Equatorial (no norte).\n  - **Relevo:** Chapadas (Guimarães, Parecis), Planícies (Pantanal) e Depressões.\n  - **Biomas:** Amazônia (54%), Cerrado (39%), Pantanal (7%).\n  - **Hidrografia:** Bacias Amazônica, Platina (Paraguai) e Tocantins-Araguaia.\n\n### 3. Políticas de gestão ambiental\n- **Resumo Teórico:** Foco no monitoramento de desmatamento, queimadas, e a criação/gestão de Unidades de Conservação e terras indígenas pela SEMA e IBAMA.\n- **Dicas Cesgranrio:** Tema muito provável para redação/questões devido à atual crise climática e incêndios no Pantanal/Cerrado.\n- **Pontos-chave:**\n  - SEMA-MT e CAR (Cadastro Ambiental Rural).\n  - Unidades de Conservação Estaduais.\n  - Conflitos ambientais: garimpo ilegal, desmatamento para pasto.\n\n### 4. Características econômicas\n- **Resumo Teórico:** MT é a maior potência do agronegócio brasileiro, líder nacional na produção de soja, algodão, milho e no rebanho bovino.\n- **Dicas Cesgranrio:** Agronegócio gera alta concentração de renda e foca em commodities para exportação.\n- **Pontos-chave:**\n  - Soja e Algodão (líder nacional).\n  - Rebanho Bovino comercial (maior do país).\n  - Industrialização focada em agroindústria (esmagamento de soja, frigoríficos, etanol de milho).\n\n### 5. Geografia da população\n- **Resumo Teórico:** População formada por intensa migração, especialmente sulistas (gaúchos/paranaenses) a partir dos anos 1970 para áreas de fronteira agrícola.\n- **Dicas Cesgranrio:** Compreenda o choque cultural e a miscigenação (cuiabano tradicional vs. migrante sulista).\n- **Pontos-chave:**\n  - Alta taxa de urbanização.\n  - Desigualdade na distribuição de renda.\n  - Migração de sulistas impulsionada por políticas do governo militar.\n\n### 6. Processo de urbanização\n- **Resumo Teórico:** Crescimento de cidades ao longo das rodovias (eixos) impulsionado pelo agronegócio.\n- **Dicas Cesgranrio:** Diferença entre a capital administrativa (Cuiabá) e os \"polos do agro\" (Sinop, Rondonópolis, Sorriso).\n- **Pontos-chave:**\n  - Cuiabá e Várzea Grande (Região Metropolitana).\n  - Rondonópolis (hub logístico/ferroviário no sul).\n  - Sinop e Sorriso (polos da BR-163 e agronegócio no norte).\n\n### 7. Dinâmica do espaço agrário\n- **Resumo Teórico:** Predominância do latifúndio monocultor, alta mecanização e tecnologia, contrastando com a agricultura familiar e assentamentos.\n- **Dicas Cesgranrio:** O modelo agroexportador e seus impactos sociais (conflitos fundiários, expropriação).\n- **Pontos-chave:**\n  - Concentração fundiária.\n  - Expansão rápida da fronteira agrícola sobre o cerrado e borda amazônica.\n  - Tensão entre modernização e conflito agrário.\n\n## PARTE 2: HISTÓRIA DE MT\n\n### 1. Povos indígenas antes da colonização\n- **Resumo Teórico:** Rica diversidade étnica antes da chegada europeia. Grupos como Bororo, Xavante, Paresi e Kayapó dominavam diferentes regiões.\n- **Dicas Cesgranrio:** Os indígenas não foram atores passivos; eles resistiram, negociaram e sofreram intenso etnocídio.\n- **Pontos-chave:**\n  - Diversidade de nações indígenas.\n  - Ocupação pré-colonial.\n  - Impacto devastador do contato europeu.\n\n### 2. Missões e catequese (séc. XVII)\n- **Resumo Teórico:** Primeiras incursões espanholas (jesuítas) na região do Itatim, catequizando indígenas para fixação.\n- **Dicas Cesgranrio:** Os jesuítas sofreram ataques de bandeirantes paulistas que buscavam escravizar os nativos.\n- **Pontos-chave:**\n  - Missões jesuíticas (espanholas).\n  - Foco na conversão.\n  - Conflito com bandeirantes.\n\n### 3. Bandeiras (séc. XVIII)\n- **Resumo Teórico:** Bandeiras de preamento (caça ao índio) e prospectoras (busca por metais preciosos) vindas de São Paulo.\n- **Dicas Cesgranrio:** Bandeiras paulistas foram as responsáveis pela expansão das fronteiras luso-brasileiras além do Tratado de Tordesilhas.\n- **Pontos-chave:**\n  - Antônio Pires de Campos e Pascoal Moreira Cabral.\n  - Escravização de indígenas.\n  - Descoberta das primeiras lavras de ouro.\n\n### 4. Cuiabá - de Arraial a Vila\n- **Resumo Teórico:** Fundação oficial em 1719 após a descoberta do ouro nas margens do Rio Coxipó por Pascoal Moreira Cabral.\n- **Dicas Cesgranrio:** Em 1727, elevou-se a Vila Real do Senhor Bom Jesus de Cuiabá. A elite \"Sorocabana\" controlava o comércio e abastecimento (Monções).\n- **Pontos-chave:**\n  - Ata de Fundação (1719).\n  - Expedições fluviais (Monções) ligando SP a Cuiabá.\n  - Sorocabanos (comerciantes influentes).\n\n### 5. Vila Bela da Santíssima Trindade\n- **Resumo Teórico:** Fundada em 1752 no Vale do Guaporé por Gomes Freire de Andrade. Foi a primeira capital da Capitania de MT.\n- **Dicas Cesgranrio:** Criada por motivos geopolíticos para garantir a posse de Portugal contra as pretensões espanholas na fronteira oeste.\n- **Pontos-chave:**\n  - Primeira Capital.\n  - Defesa militar e controle da fronteira (Tratado de Madri - 1750).\n  - Decadência precoce devido à distância e surtos de malária.\n\n### 6. Mineração\n- **Resumo Teórico:** Base econômica do séc. XVIII. Foco no ouro de aluvião.\n- **Dicas Cesgranrio:** Mão de obra majoritariamente de africanos escravizados, em condições severas.\n- **Pontos-chave:**\n  - Ciclo do Ouro.\n  - Exploração de aluvião (rápido esgotamento).\n  - Intensa utilização de escravizados africanos.\n\n### 7. Decadência da mineração → Pecuária\n- **Resumo Teórico:** Com o fim do ouro (início do séc. XIX), MT passa por isolamento econômico, substituindo a mineração pela pecuária extensiva, poaia e engenhos de açúcar.\n- **Dicas Cesgranrio:** Transição para economia de subsistência e isolamento geográfico duradouro.\n- **Pontos-chave:**\n  - Fim do ciclo aurífero.\n  - Pecuária extensiva na região pantaneira.\n  - Extrativismo (poaia/ipecacuanha e borracha depois).\n\n### 8. A Rusga (1834)\n- **Resumo Teórico:** Revolta de caráter nativista em Cuiabá (período regencial) onde \"brasileiros\" (nativistas) massacraram portugueses (adotivos).\n- **Dicas Cesgranrio:** Refletia o sentimento antilusitano e a crise econômica/política do pós-Independência.\n- **Pontos-chave:**\n  - 1834 (Período Regencial).\n  - Brasileiros x Portugueses.\n  - Contexto de crise econômica e insatisfação militar.\n\n### 9. Guerra da Tríplice Aliança (1864-1870)\n- **Resumo Teórico:** Guerra do Paraguai. MT foi a primeira província invadida por Solano López em 1864, via Rio Paraguai.\n- **Dicas Cesgranrio:** A \"Retirada da Laguna\" foi a trágica tentativa das tropas brasileiras (vindas de MG/RJ) de retomar territórios invadidos em MT (atual MS).\n- **Pontos-chave:**\n  - Invasão paraguaia em Corumbá e forte de Coimbra.\n  - Isolamento de Cuiabá.\n  - Abertura da navegação do Rio Paraguai no pós-guerra.\n\n### 10. Estado Novo e Marcha para o Oeste\n- **Resumo Teórico:** Política de Getúlio Vargas nos anos 1940 para integrar o Centro-Oeste e Amazônia. Fundação de colônias agrícolas e Cidades (Goiânia). Expedição Roncador-Xingu.\n- **Dicas Cesgranrio:** Fundação da Colônia Agrícola de Dourados e a Fundação Brasil Central.\n- **Pontos-chave:**\n  - Integração nacional de Vargas.\n  - Colonização dirigida pelo Estado.\n  - Expedição Roncador-Xingu (Irmãos Villas-Bôas).\n\n### 11. Ditadura e Divisão do Estado\n- **Resumo Teórico:** Ditadura Militar incentiva a colonização privada (projetos da SUDAM, rodovias BR-163 e BR-364). Em 1977, Lei Complementar nº 31 divide MT, criando Mato Grosso do Sul (efetivado em 1979).\n- **Dicas Cesgranrio:** O norte (atual MT) permaneceu mais focado na integração com a Amazônia, enquanto o sul (MS) estava mais ligado a SP/PR.\n- **Pontos-chave:**\n  - Incentivos fiscais e colonizadoras privadas (Sinop, etc).\n  - Divisão geopolítica em 1977 (Ernesto Geisel).\n  - Início do boom do agronegócio.\n\n### 12. Tensões no campo\n- **Resumo Teórico:** Conflitos gerados pela rápida expansão da fronteira, grilagem de terras, posseiros x fazendeiros, indígenas, e movimentos camponeses (MST).\n- **Dicas Cesgranrio:** O \"Eldorado\" mato-grossense atraiu muitos sem-terra e causou violentos conflitos rurais nas décadas de 80, 90 e 2000.\n- **Pontos-chave:**\n  - Grilagem e sobreposição de títulos de terra.\n  - Massacre de trabalhadores e lideranças rurais.\n  - Disputas envolvendo terras indígenas e Unidades de Conservação.\n\n## Dados Importantes para Memorizar\n\n| Informação | Dado |\n| :--- | :--- |\n| **Capital** | Cuiabá |\n| **Biomas** | Amazônia, Cerrado e Pantanal |\n| **Área Territorial** | ~ 903.000 km² (3º maior do BR) |\n| **População (2022)** | ~ 3,6 milhões |\n| **Principais Rios** | Paraguai, Cuiabá, Araguaia, Teles Pires, Juruena |\n| **Economia** | Agropecuária (Soja, Algodão, Milho, Bovinos) |\n\n## Checklist de Revisão\n- [ ] Produção do espaço regional\n- [ ] Aspectos naturais (clima, relevo, vegetação, hidrografia)\n- [ ] Políticas de gestão ambiental e SEMA\n- [ ] Características econômicas e Agronegócio\n- [ ] Geografia da população e demografia\n- [ ] Processo de urbanização\n- [ ] Dinâmica do espaço agrário\n- [ ] Povos indígenas antes da colonização\n- [ ] Missões e catequese (séc. XVII)\n- [ ] Bandeiras e expansão (séc. XVIII)\n- [ ] Cuiabá - fundação e ciclo do ouro\n- [ ] Vila Bela da Santíssima Trindade\n- [ ] Mineração (ouro e escravidão)\n- [ ] Decadência da mineração e Pecuária\n- [ ] A Rusga (1834)\n- [ ] Guerra do Paraguai (1864-1870) e Retirada da Laguna\n- [ ] Estado Novo, Vargas e Marcha para o Oeste\n- [ ] Ditadura, Projetos de Colonização e Divisão do Estado (1977)\n- [ ] Tensões no campo e conflitos fundiários\n"}, {"id": "05-etica-filosofia", "title": "⚖️ Ética, Filosofia e Legislação", "category": "Conhecimentos Gerais", "fileName": "05 - Ética, Filosofia, Atualidades e Legislação.md", "content": "---\ntags: [etica, filosofia, atualidades, legislacao, 5-questoes]\n---\n# ⚖️ Ética, Filosofia, Atualidades e Legislação Específica (5 questões | 5 pontos)\n\n## ÉTICA E FILOSOFIA\n\n### 1. Filosofia como busca racional\n- **Resumo:** A filosofia surge na Grécia Antiga como transição do pensamento mítico (mito) para o pensamento racional (logos).\n- **Foco:** Busca por respostas através da razão, questionamento e argumentação crítica.\n- **Pontos-chave:** Reflexão radical, rigorosa e de conjunto.\n\n### 2. Tipos de conhecimento\n- **Empírico (Senso Comum):** Baseado na experiência diária, assistemático, acrítico.\n- **Científico:** Metódico, sistemático, testável, objetivo.\n- **Filosófico:** Racional, questionador, busca os fundamentos e a essência, não precisa de validação laboratorial, mas de consistência lógica.\n- **Teológico/Religioso:** Baseado na fé e dogmas revelados.\n\n### 3. Correntes epistemológicas\n- **Racionalismo (Descartes):** A razão é a única fonte do conhecimento verdadeiro (ideias inatas). Penso, logo existo.\n- **Empirismo (Locke, Hume):** Todo conhecimento provém da experiência sensorial. A mente é uma \"tábula rasa\".\n- **Criticismo (Kant):** Síntese. O conhecimento começa com a experiência, mas não deriva todo dela; necessita das estruturas a priori da razão.\n\n### 4. Desafios contemporâneos\n- **Pós-verdade:** Fatos objetivos têm menos influência do que apelos à emoção e a crenças pessoais.\n- **Fake News:** Desinformação disseminada em rede, afetando a democracia e o debate público.\n- **Inteligência Artificial:** Dilemas éticos sobre viés algorítmico, substituição de empregos e privacidade.\n\n### 5. Assédio moral e sexual\n- **Assédio Moral:** Conduta abusiva, frequente e reiterada (palavras, atos, gestos) que atenta contra a dignidade ou integridade psíquica da pessoa (humilhações no trabalho).\n- **Assédio Sexual:** Conduta de natureza sexual, não desejada, com o intuito de obter vantagem ou favorecimento, prevalecendo-se da condição de superior hierárquico.\n- **Medidas:** Denúncias anônimas, corregedorias, canais de ética, campanhas de conscientização.\n\n### 6. Atitudes éticas\n- **Ética vs Moral:** Moral é o conjunto de regras (prática); Ética é a reflexão sobre essas regras (teoria).\n- **Serviço Público:** Pautado na legalidade, impessoalidade, moralidade, publicidade e eficiência. Respeito ao cidadão, probidade, honestidade e virtude.\n\n## ATUALIDADES\n\n> [!TIP]\n> **Dicas de Estudo para Atualidades:** Acompanhe noticiários, podcasts e resumos semanais de cursinhos. Foque em eventos com impacto nacional ou global sustentado, evitando notícias passageiras.\n\n**Temas Quentes (2025/2026):**\n- **Agenda Ambiental:** O papel do Brasil (e de MT) nas COPs, combate ao desmatamento na Amazônia e Pantanal, crise hídrica e ondas de calor extremos.\n- **Queimadas em MT:** Impactos no Pantanal, atuação da SEMA/Ibama, políticas de mitigação e fundo Amazônia.\n- **Economia Brasileira:** Reforma tributária, inflação, transição energética (hidrogênio verde, energia solar/eólica).\n- **Geopolítica:** Conflitos globais em andamento, reorganização de blocos econômicos (BRICS).\n\n## LEGISLAÇÃO ESPECÍFICA\n\n### 1. LC nº 112/2002 - Código de Ética do Servidor de MT\n- **Princípios:** Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência, Razoabilidade e Proporcionalidade.\n- **Deveres:** Zelar pelo patrimônio, urbanidade, assiduidade, sigilo profissional.\n- **Proibições:** Receber propina, usar o cargo para favorecimento, embriaguez habitual no serviço.\n- **Comissões de Ética:** Objetivo de orientar e aconselhar. A pena aplicável por essa comissão é a de **CENSURA** (decisão fundamentada e escrita).\n\n### 2. LC nº 04/1990 - Estatuto dos Servidores de MT\n- **Provimento:** Nomeação, Promoção, Readaptação, Reversão, Aproveitamento, Reintegração, Recondução.\n- **Estágio Probatório:** Avaliação de aptidão e capacidade para o cargo.\n- **Penalidades Disciplinares:** Advertência, Suspensão, Demissão, Cassação de aposentadoria, Destituição de cargo em comissão.\n- **Demissão:** Aplicada em casos de crime contra a administração pública, abandono de cargo (mais de 30 dias consecutivos), inassiduidade habitual (mais de 60 dias interpolados em 12 meses), improbidade administrativa.\n\n### 3. LC nº 38/1995 - Código Estadual do Meio Ambiente de MT\n- **Foco Central:** Política ambiental estadual de proteção, conservação e melhoria do meio ambiente.\n- **Competências da SEMA:** Fiscalizar, monitorar, licenciar e multar atividades poluidoras.\n- **Licenciamento Ambiental:** Instrumento da Política Estadual (Licença Prévia, de Instalação e de Operação - LP, LI, LO). É exigível para construção, instalação, ampliação e funcionamento de atividades poluidoras.\n- **Infrações:** A responsabilidade administrativa ambiental é autônoma (independe de dolo ou culpa, mas exige nexo causal).\n\n## Checklist de Revisão\n- [ ] Filosofia como busca racional e Tipos de conhecimento\n- [ ] Correntes epistemológicas (Racionalismo, Empirismo, Criticismo)\n- [ ] Pós-verdade, fake news, impacto da IA\n- [ ] Assédio moral e sexual no trabalho\n- [ ] Atitudes éticas no serviço público\n- [ ] Revisão de Atualidades (Meio ambiente, economia, MT)\n- [ ] LC nº 112/2002 (Código de Ética de MT - Focar na CENSURA)\n- [ ] LC nº 04/1990 (Estatuto - Provimento e Demissão/Abandono)\n- [ ] LC nº 38/1995 (Código Ambiental - Licenciamento LP, LI, LO)\n"}, {"id": "06-legislacao-ambiental", "title": "🌿 Legislação e Política Ambiental", "category": "Conhecimentos Transversais", "fileName": "06 - Legislação Ambiental (Transversal).md", "content": "---\ntags:\n  - legislacao-ambiental\n  - transversal\n  - especifico\n---\n\n# 🌿 Legislação e Política Ambiental (Conteúdo Transversal)\n\n> [!NOTE]\n> Este conteúdo é compartilhado por todos os perfis do cargo de Analista de Meio Ambiente e constitui a base legal da atuação do órgão. A atenção aos detalhes e competências é fundamental!\n\n## 1. Política Nacional do Meio Ambiente - Lei 6.938/81\n\nA PNMA é o marco regulatório do meio ambiente no Brasil, estabelecendo o SISNAMA e definindo a responsabilidade civil objetiva para danos ambientais.\n\n> [!TIP]\n> **O que a Cesgranrio cobra:**\n> A banca adora confundir os órgãos do SISNAMA (principalmente CONAMA vs. IBAMA) e listar instrumentos que NÃO são da PNMA. A responsabilidade civil objetiva é tema recorrente.\n\n- **Pontos-chave:**\n  - Institui o Sistema Nacional de Meio Ambiente (SISNAMA).\n  - Define o meio ambiente como patrimônio público a ser assegurado e protegido.\n  - Consagra a responsabilidade civil **objetiva** (independe de culpa) do poluidor.\n  - Prevê 13 instrumentos da PNMA (ex: zoneamento ambiental, licenciamento, avaliação de impactos, penalidades).\n  - Cria o Cadastro Técnico Federal (CTF).\n- **Artigos mais cobrados:** Art. 2º (Princípios), Art. 4º (Objetivos), Art. 6º (Estrutura do SISNAMA), Art. 9º (Instrumentos) e Art. 14, §1º (Responsabilidade objetiva).\n\n## 2. CF/88 Art. 225\n\nO artigo fundamental do meio ambiente na Constituição Federal, garantindo o direito a um meio ambiente ecologicamente equilibrado.\n\n> [!TIP]\n> **O que a Cesgranrio cobra:**\n> Competências (art. 23 e 24), a tríplice responsabilização (civil, penal e administrativa) e os deveres do Poder Público (incisos do §1º).\n\n- **Pontos-chave:**\n  - Meio ambiente é bem de uso comum do povo e essencial à sadia qualidade de vida.\n  - Impõe ao Poder Público e à coletividade o dever de defendê-lo e preservá-lo.\n  - Exigência de EIA/RIMA para obras/atividades potencialmente causadoras de significativa degradação.\n  - Tríplice responsabilidade para infratores (pessoas físicas ou jurídicas).\n  - Proteção especial para biomas como Floresta Amazônica, Mata Atlântica e Pantanal.\n- **Artigos mais cobrados:** Art. 225 (caput e parágrafos), Art. 23 (Competência Comum), Art. 24 (Competência Concorrente).\n\n## 3. Código Estadual do Meio Ambiente MT - LC 38/95\n\nInstitui a Política Estadual de Meio Ambiente e reestrutura o sistema ambiental em Mato Grosso.\n\n> [!TIP]\n> **O que a Cesgranrio cobra:**\n> Detalhes específicos sobre o licenciamento estadual e a estrutura do CONSEMA/MT.\n\n- **Pontos-chave:**\n  - Adapta as diretrizes nacionais à realidade do estado de MT.\n  - Define o papel da SEMA-MT como órgão executor.\n  - Estabelece as regras e infrações administrativas no estado.\n  - Instrumentos estaduais de proteção e controle.\n- **Artigos mais cobrados:** Estrutura do sistema estadual, competências do CONSEMA, procedimentos de licenciamento.\n\n## 4. LC 140/2011\n\nRegulamenta o Art. 23 da CF/88, definindo as regras de cooperação federativa nas ações administrativas decorrentes do exercício da competência comum.\n\n> [!TIP]\n> **O que a Cesgranrio cobra:**\n> A diferença entre atuação supletiva e subsidiária. Quem licencia o quê (critério do impacto e dominialidade).\n\n- **Pontos-chave:**\n  - O licenciamento é feito por um ÚNICO ente federativo.\n  - **Atuação Supletiva:** Substituição do ente originariamente competente que omite sua função.\n  - **Atuação Subsidiária:** Auxílio prestado ao ente originariamente competente.\n  - Define competências da União (impacto nacional/regional, mar territorial), Estados e Municípios (impacto local).\n- **Artigos mais cobrados:** Art. 7º (União), Art. 8º (Estados), Art. 9º (Municípios), Art. 14 e 15 (Atuação Supletiva e Subsidiária).\n\n## 5. Decreto 8.437/2015\n\nRegulamenta as tipologias de empreendimentos e atividades cujo licenciamento ambiental é de competência da União.\n\n> [!TIP]\n> **O que a Cesgranrio cobra:**\n> Listas exaustivas do que cabe ao IBAMA (ferrovias interestaduais, portos, energia nuclear).\n\n- **Pontos-chave:**\n  - Estabelece clareza sobre o alcance do Art. 7º da LC 140.\n  - Obras de infraestrutura de caráter nacional ou transfronteiriço.\n  - Rodovias federais, ferrovias nacionais, portos organizados.\n  - Empreendimentos no mar territorial e plataforma continental.\n- **Artigos mais cobrados:** Anexo (Tipologias) e Art. 3º e 4º.\n\n## 6. Lei de Crimes Ambientais - Lei 9.605/98\n\nDispõe sobre as sanções penais e administrativas derivadas de condutas e atividades lesivas ao meio ambiente.\n\n> [!TIP]\n> **O que a Cesgranrio cobra:**\n> Desconsideração da pessoa jurídica, os tipos de crimes (ex: fauna vs. flora) e a responsabilidade da Pessoa Jurídica (condições para aplicação).\n\n- **Pontos-chave:**\n  - Responsabilização penal da Pessoa Jurídica (exige que a infração seja cometida por decisão de seu representante, no interesse ou benefício da entidade).\n  - Tipologia dos crimes: Fauna, Flora, Poluição e outros, Ordenamento Urbano/Patrimônio Cultural e Administração Ambiental.\n  - Penas: privativas de liberdade, restritivas de direitos, multa.\n  - Possibilidade de transação penal e suspensão condicional do processo (crimes de menor potencial).\n- **Artigos mais cobrados:** Art. 2º a 4º (Responsabilidade da PJ), Art. 29 (Fauna), Art. 38 e afins (Flora), Art. 54 (Poluição).\n\n## 7. Política Nacional de Recursos Hídricos - Lei 9.433/97\n\nInstitui a Política Nacional de Recursos Hídricos e cria o Sistema Nacional de Gerenciamento de Recursos Hídricos (SINGREH).\n\n> [!TIP]\n> **O que a Cesgranrio cobra:**\n> Os fundamentos (água é bem de domínio público, dotada de valor econômico) e quem compõe os Comitês de Bacia.\n\n- **Pontos-chave:**\n  - Água: bem de domínio público; recurso natural limitado com valor econômico.\n  - Prioridade em situação de escassez: consumo humano e dessedentação de animais.\n  - Bacia hidrográfica como unidade territorial de gestão.\n  - Instrumentos: Planos, Outorga, Cobrança pelo uso, Enquadramento de corpos d'água, Sistema de Informação.\n- **Artigos mais cobrados:** Art. 1º (Fundamentos), Art. 5º (Instrumentos), Art. 11 a 18 (Outorga), Art. 37 a 39 (Comitês de Bacia).\n\n## 8. PNRS - Lei 12.305/10 (Resíduos Sólidos)\n\nEstabelece princípios, objetivos, instrumentos e diretrizes relativas à gestão integrada e ao gerenciamento de resíduos sólidos.\n\n> [!TIP]\n> **O que a Cesgranrio cobra:**\n> Diferença entre resíduo e rejeito, ordem de prioridade na gestão, logística reversa (produtos obrigatórios) e responsabilidade compartilhada.\n\n- **Pontos-chave:**\n  - Distinção: Resíduo (pode ser reaproveitado) vs. Rejeito (apenas disposição final ambientalmente adequada).\n  - Ordem de prioridade: não geração, redução, reutilização, reciclagem, tratamento e disposição final.\n  - Responsabilidade Compartilhada pelo ciclo de vida dos produtos.\n  - Logística Reversa: fabricantes, importadores, distribuidores e comerciantes (ex: pilhas, pneus, agrotóxicos).\n  - Planos de Resíduos Sólidos (nacional, estadual, microrregional, municipal).\n- **Artigos mais cobrados:** Art. 3º (Conceitos), Art. 9º (Prioridade), Art. 30 (Responsabilidade compartilhada), Art. 33 (Logística Reversa obrigatória).\n\n## 9. Saneamento - Lei 11.445/07 + Lei 14.026/20 (Novo Marco)\n\nEstabelece as diretrizes nacionais para o saneamento básico (abastecimento de água, esgotamento sanitário, limpeza urbana e manejo de resíduos sólidos, drenagem e manejo das águas pluviais urbanas).\n\n> [!TIP]\n> **O que a Cesgranrio cobra:**\n> As metas de universalização (2033), proibição de contratos de programa (exigência de licitação), e papel regulador da ANA.\n\n- **Pontos-chave:**\n  - Quatro componentes do saneamento básico.\n  - Metas de universalização até 2033 (99% com água potável e 90% com coleta e tratamento de esgotos).\n  - Agência Nacional de Águas e Saneamento Básico (ANA) define normas de referência para regulação.\n  - Regionalização da prestação dos serviços.\n- **Artigos mais cobrados:** Art. 2º (Princípios), Art. 3º (Definições), Art. 11-B (Metas de universalização).\n\n## 10. Segurança de Barragens - Lei 12.334/10\n\nEstabelece a Política Nacional de Segurança de Barragens (PNSB) e cria o Sistema Nacional de Informações sobre Segurança de Barragens (SNISB).\n\n> [!TIP]\n> **O que a Cesgranrio cobra:**\n> Quando uma barragem se enquadra na lei e a obrigatoriedade do Plano de Ação de Emergência (PAE).\n\n- **Pontos-chave:**\n  - Aplica-se a barragens com altura ≥ 15m, capacidade ≥ 3 milhões de m³, ou Dano Potencial Associado (DPA) alto/médio.\n  - Classificação feita por Risco (CRI) e Dano Potencial Associado (DPA).\n  - Plano de Ação de Emergência (PAE) obrigatório para DPA alto.\n  - Responsabilidade legal e financeira do empreendedor.\n- **Artigos mais cobrados:** Art. 1º (Aplicabilidade), Art. 7º e 8º (Classificação), Art. 11 e 12 (PAE).\n\n## 11. a 28. (Demais Legislações Resumidas)\n\n> [!NOTE]\n> Para fins práticos de estudo, foque nos conceitos centrais e instrumentos das normas a seguir.\n\n*   **Mudanças Climáticas (Lei 12.187/09 + LC 582/17 MT):** Foca em mitigação e adaptação. Instrumentos principais: Fundo Clima, mercado de carbono, metas voluntárias (e agora compromissos NDC).\n*   **Código Florestal (Lei 12.651/12):** Fundamental! Regras de APP (faixas marginais, topos de morro), Reserva Legal (80% na Amazônia Legal, 35% Cerrado, 20% demais biomas), CAR (registro público eletrônico obrigatório), e PRA.\n*   **SNUC (Lei 9.985/00):** Divisão em UCs de Proteção Integral (ex: Parque Nacional, Estação Ecológica - regra é preservação sem consumo) e Uso Sustentável (ex: APA, RESEX - admite exploração sustentável). Zona de amortecimento e Plano de Manejo.\n*   **SEUC MT (Lei 9.502/11):** Espelha o SNUC para a realidade mato-grossense, focando nas APAs estaduais e parques estaduais.\n*   **Biodiversidade (Lei 13.123/15):** Acesso ao patrimônio genético e conhecimento tradicional associado; repartição de benefícios. SisGen.\n*   **Proteção à Fauna (Lei 5.197/67):** Fauna silvestre é propriedade do Estado. Proibição geral de caça profissional, permissão de controle populacional sob autorização.\n*   **Outras Leis MT:** Serviços Ambientais, Pesca (regras específicas de defeso e apetrechos), Bacia Alto Paraguai (restrições a atividades no Pantanal), Educação Ambiental.\n*   **PSA (Lei 14.119/21):** Cria o pagamento por serviços ambientais (monetário ou não). Foco em produtores rurais que conservam áreas além do exigido por lei.\n*   **LAI e LGPD:** Transparência ativa e passiva nos dados ambientais; proteção de dados pessoais em processos sancionadores e licenciamento.\n*   **Regularização Ambiental (LC 592/17 MT):** Institui o Programa de Regularização Ambiental (PRA) estadual e o SIMCAR (sistema estadual).\n*   **Licenciamento Geral (Lei 15.190/25):** Nova lei estadual! Atenção às atualizações de prazos, licenças por adesão e compromisso (LAC), e ritos simplificados.\n*   **Manejo do Fogo (Lei 14.944/24):** Política de controle de queimadas, queima controlada vs. prescrita, brigadas.\n*   **Decreto 697/2020 e 1.268/2022 (MT):** Especificidades administrativas do rito de licenciamento dentro da SEMA/MT e cobrança de taxas.\n*   **Resolução CONSEMA 74/2025:** Define claramente o que é impacto local para fins de licenciamento pelos municípios de MT.\n*   **Recursos Hídricos MT:** Gestão das águas subterrâneas e processos de outorga estadual.\n"}, {"id": "07-licenciamento", "title": "🔍 Licenciamento e Fiscalização", "category": "Conhecimentos Transversais", "fileName": "07 - Licenciamento e Fiscalização Ambiental.md", "content": "---\ntags:\n  - licenciamento\n  - fiscalizacao\n  - transversal\n---\n\n# 🔍 Licenciamento e Fiscalização Ambiental\n\n> [!IMPORTANT]\n> Esta seção aborda o \"coração\" da rotina do Analista de Meio Ambiente. O conhecimento sobre as fases do licenciamento e os instrumentos de controle é exigência garantida na prova.\n\n## 1. Procedimentos de Licenciamento: LP, LI, LO\n\nO licenciamento ambiental é um procedimento administrativo complexo pelo qual o órgão ambiental competente licencia a localização, instalação, ampliação e operação de empreendimentos e atividades.\n\n- **Licença Prévia (LP):** \n  - Concedida na fase preliminar do planejamento.\n  - Aprova a localização e concepção, atestando a viabilidade ambiental.\n  - Estabelece os requisitos básicos para as próximas fases.\n  - **Validade máxima:** 5 anos.\n- **Licença de Instalação (LI):**\n  - Autoriza a instalação do empreendimento de acordo com as especificações constantes dos planos aprovados.\n  - **Validade máxima:** 6 anos.\n- **Licença de Operação (LO):**\n  - Autoriza a operação da atividade após a verificação do cumprimento do que consta nas licenças anteriores (LP e LI) e o funcionamento das medidas de controle ambiental.\n  - **Validade máxima:** 10 anos (Mínima de 4 anos).\n- **Renovação:** Deve ser requerida com antecedência mínima de **120 dias** da expiração de seu prazo de validade (garante a prorrogação automática até a manifestação definitiva do órgão).\n\n## 2. EIA/RIMA (Estudo de Impacto Ambiental e respectivo Relatório)\n\nExigido para atividades com **significativa degradação ambiental** (Art. 225, §1º, IV, CF).\n\n- **EIA (Estudo):** Documento técnico profundo, elaborado por equipe multidisciplinar. Analisa diagnósticos (meio físico, biótico e socioeconômico), impactos, medidas mitigadoras e compensatórias.\n- **RIMA (Relatório):** A versão traduzida e acessível do EIA, elaborada em linguagem clara, objetiva e adequada à compreensão da sociedade, contendo a conclusão técnica.\n- **Publicidade e Participação:** É obrigatória a publicidade do RIMA. Caso solicitado pelo órgão, MP, ou 50 cidadãos, deverá ocorrer Audiência Pública.\n\n## 3. Tipos de Licenças e Processo (Geral)\n\n- **Audiências Públicas:** Instrumento de participação popular. Tem caráter consultivo (não vinculante).\n- **Compensação Ambiental:** Obrigatória em casos de EIA/RIMA (Lei do SNUC). O valor é destinado a unidades de conservação de proteção integral (não pode ser inferior a 0,5% do valor da obra - STF declarou inconstitucional o percentual fixo, deve ser proporcional ao impacto).\n- **Condicionantes:** Obrigações fixadas nas licenças que o empreendedor deve cumprir. O descumprimento pode gerar suspensão ou cancelamento da licença, além de multas.\n\n## 4. Estudos Ambientais (Além do EIA)\n\n- **RAS (Relatório Ambiental Simplificado):** Usado para licenciamento de atividades de pequeno potencial de impacto ambiental (ex: energia eólica e PCHs sob certas condições).\n- **PCA (Plano de Controle Ambiental):** Detalha as medidas mitigadoras durante a LI (geralmente exigido em atividades minerárias).\n- **RCA (Relatório de Controle Ambiental):** Alternativa ao EIA para atividades minerárias sem significativo impacto.\n- **PGRS (Plano de Gerenciamento de Resíduos Sólidos):** Instrumento da PNRS, descreve as ações relativas ao manejo dos resíduos gerados.\n- **PRAD (Plano de Recuperação de Áreas Degradadas):** Exigido para projetos de mineração, desmatamento ilegal, ou sempre que houver degradação que exija restauração das características ecológicas originais.\n- **EVTEA (Estudo de Viabilidade Técnica, Econômica e Ambiental):** Normalmente exigido em infraestrutura de transportes para análise de viabilidade inicial.\n\n## 5. Outorga de Recursos Hídricos (Decreto 336/07)\n\nA outorga não dá a propriedade da água, mas o direito de uso por prazo determinado.\n\n- **Uso sujeito a outorga:** Captação de água (superficial/subterrânea), lançamentos de efluentes que alterem quantidade/qualidade, barramentos, aproveitamento hidrelétrico.\n- **Uso INDEPENDENTE de outorga:** Usos insignificantes, satisfação de necessidades de pequenos núcleos populacionais dispersos, captações de volume reduzido.\n- **Prazo máximo:** 35 anos, renovável.\n- **Competência:** ANA (rios federais/transfronteiriços) ou Órgão Estadual (ex: SEMA-MT para rios estaduais e águas subterrâneas).\n\n## 6. Fiscalização Ambiental\n\n- **Poder de Polícia:** O órgão ambiental tem o poder de restringir direitos em prol do interesse público ambiental (fiscalizar, autuar, embargar).\n- **Autos de Infração:** Peça que inicia o processo administrativo sancionador. Deve descrever clara e objetivamente a infração e a norma violada.\n- **Sanções:** Multas (simples ou diária), embargo de obra, apreensão de animais/produtos/equipamentos, suspensão de atividades.\n- A fiscalização ocorre de forma repressiva, mas também tem caráter orientador.\n\n## 7. Resíduos Sólidos e Drenagem\n\n- **Resíduos:** A disposição em lixões é terminantemente proibida. Exigência de aterros sanitários adequados e sistemas de tratamento (compostagem, biogás, reciclagem).\n- **Drenagem Urbana (Macrodrenagem vs. Microdrenagem):**\n  - *Microdrenagem:* Coleta de águas pluviais em pequenos lotes e ruas (bocas de lobo, galerias).\n  - *Macrodrenagem:* Canais principais, rios canalizados e grandes bacias de detenção/retenção urbanas (piscinões) que recebem a água da microdrenagem.\n\n## 9. Medidas Compensatórias e TAC\n\n- **TAC (Termo de Ajustamento de Conduta):** Instrumento com força de título executivo extrajudicial. O empreendedor se compromete a adequar sua conduta às exigências legais, sob pena de multas, em troca da paralisação de ações civis e adequação progressiva.\n\n## 10. Resoluções CONAMA Fundamentais\n\n- **CONAMA 001/86:** Dispõe sobre as diretrizes gerais e os casos em que se exige EIA/RIMA (ex: estradas, ferrovias, portos, aeroportos, aterros de resíduos tóxicos, usinas, grandes hidrelétricas).\n- **CONAMA 237/97:** O \"código de processo\" do licenciamento. Define conceitos de LP, LI, LO, prazos, e a lista exemplificativa (Anexo 1) de atividades sujeitas a licenciamento.\n- **CONAMA 009/87:** Trata das Audiências Públicas no processo de licenciamento ambiental (forma de convocação, finalidade).\n"}, {"id": "08-recursos-clima", "title": "🌍 Recursos Naturais, Poluição e Clima", "category": "Conhecimentos Transversais", "fileName": "08 - Recursos Naturais, Poluição e Clima.md", "content": "---\ntags:\n  - recursos-naturais\n  - poluicao\n  - clima\n  - transversal\n---\n\n# 🌍 Recursos Naturais, Poluição e Mudanças Climáticas\n\n> [!WARNING]\n> Esta disciplina exige conhecimentos técnicos integrados: ecologia básica aplicada, noções de química e processos de contaminação e remediação, aliados ao contexto global e de gestão.\n\n## Recursos Naturais e Biodiversidade\n\n- **Gestão de Florestas e Uso Sustentável:**\n  - O manejo florestal sustentável exige a elaboração de Planos de Manejo (PMFS) para garantir que a taxa de extração seja inferior à capacidade de regeneração natural.\n  - **CAR (Cadastro Ambiental Rural):** Instrumento central para controle do desmatamento. É obrigatório e auto declaratório, base para adequação ambiental das propriedades (APP e RL).\n- **UCs (Unidades de Conservação):** Corredores ecológicos e mosaicos são ferramentas para conectar UCs e evitar o isolamento genético da fauna e flora.\n\n## Poluição e Controle Ambiental\n\n- **Poluição Atmosférica (CONAMA 506/24):** \n  - Foco em material particulado (MP10, MP2.5), SOx, NOx, O3, CO.\n  - PADRÕES de Qualidade do Ar: estabelecem os limites máximos de poluentes suportáveis para não afetar a saúde (primários) e o bem-estar (secundários).\n- **Poluição Hídrica e Efluentes (CONAMA 430/11):**\n  - Estabelece as condições e padrões de lançamento de efluentes.\n  - Exige que o efluente seja tratado de forma a não alterar a classe de enquadramento do corpo d'água receptor.\n- **Qualidade do Solo e Remediação (CONAMA 420/09):**\n  - Define Valores de Referência, Prevenção e Intervenção para substâncias químicas no solo.\n  - *Áreas contaminadas:* Passam por etapas de Avaliação Preliminar, Investigação Confirmatória, Investigação Detalhada e Avaliação de Risco.\n  - *Remediação:* Técnicas como biorremediação, extração de vapores, \"pump and treat\" (bombear e tratar água subterrânea).\n\n## Mudanças Climáticas\n\n- **Causas e Impactos:** \n  - Emissões de GEE (CO2, CH4, N2O) por desmatamento, agropecuária e queima de combustíveis fósseis.\n  - Impactos esperados no Brasil: aumento de secas no Nordeste e Amazônia, eventos extremos de precipitação no Sul/Sudeste.\n- **Instrumentos Econômicos e Mercado de Carbono:**\n  - *Créditos de carbono:* Certificados que equivalem a 1 tonelada de CO2 equivalente (tCO2e) evitada ou sequestrada (ex: REDD+).\n- **Sustentabilidade e Agenda 2030 (ODS):** \n  - 17 Objetivos de Desenvolvimento Sustentável. Destaque para ODS 6 (Água), 13 (Ação Climática), 14 (Vida na Água) e 15 (Vida Terrestre).\n- **Economia Circular:** Modelo focado em \"reduzir, reutilizar, recuperar e reciclar\", mantendo produtos, componentes e materiais em seu mais alto nível de utilidade (contrário da economia linear \"extrair-produzir-descartar\").\n\n## Análise e Gerenciamento de Riscos\n\n- **NBR ISO 31000:2018:**\n  - Diretrizes para gestão de riscos. Baseia-se no processo: Comunicação e Consulta, Escopo/Contexto, Avaliação de Riscos (Identificação, Análise e Avaliação), Tratamento, Monitoramento.\n- **Técnicas de Estudo de Risco:**\n  - *APR (Análise Preliminar de Risco):* Qualitativa, feita no início de projetos.\n  - *HAZOP (Hazard and Operability Study):* Detalhada, usa \"palavras-guia\" para identificar desvios em processos contínuos.\n  - *FMEA/FMECA:* Foco na falha de equipamentos/componentes e seus efeitos.\n- **PGR e PEI:**\n  - *PGR (Programa de Gerenciamento de Riscos):* Foco na prevenção contínua.\n  - *PEI (Plano de Emergência Individual - CONAMA 398/08):* Foco em acidentes com óleo e poluição hídrica; visa pronta resposta e minimização de danos.\n\n## Planejamento e Gestão Pública\n\n- O orçamento público no Brasil segue 3 leis principais de iniciativa do Executivo:\n  1. **PPA (Plano Plurianual):** Diretrizes, objetivos e metas para 4 anos (inicia no 2º ano de mandato).\n  2. **LDO (Lei de Diretrizes Orçamentárias):** Anual. Faz a ponte entre PPA e LOA, definindo prioridades, metas anuais e regras sobre a dívida/pessoal.\n  3. **LOA (Lei Orçamentária Anual):** O orçamento propriamente dito, que estima as receitas e fixa as despesas (Lei 4.320/64).\n- **LRF (LC 101/00):** Estabelece normas de finanças públicas voltadas para a responsabilidade e controle de gastos (limites de endividamento e despesa com pessoal).\n\n## Pesquisa e Informação Ambiental\n\n- **SIG (Sistemas de Informação Geográfica) e Geoprocessamento:**\n  - Ferramentas cruciais para monitoramento ambiental, fiscalização remota, zoneamento ecológico-econômico e CAR. \n  - *Sensoriamento Remoto:* Uso de imagens de satélite para detectar desmatamento e queimadas.\n- **Estatística e Inventários:** \n  - Utilizados para monitoramento da qualidade do ar/água, levantamentos populacionais da fauna (censo) e inventários florestais (cálculo de biomassa e volume de madeira).\n\n## Ética e Ouvidoria\n\n- **Ética Pública:** \n  - Pautada pelos princípios do Art. 37 da CF (LIMPE - Legalidade, Impessoalidade, Moralidade, Publicidade, Eficiência).\n  - O servidor público não decide apenas entre o legal e o ilegal, o justo e o injusto, mas também entre o **honesto e o desonesto**.\n- **Ouvidoria e Participação Social:**\n  - A ouvidoria atua no diálogo entre o cidadão e a administração pública (recebendo denúncias, reclamações, elogios, sugestões).\n  - Promove o controle social e a melhoria na prestação dos serviços públicos ambientais.\n"}, {"id": "09-geotecnia", "title": "🏗️ Geotecnia e Obras de Terra", "category": "Engenharia Civil", "fileName": "09 - Geotecnia e Obras de Terra.md", "content": "---\ntags:\n  - geotecnia\n  - fundacoes\n  - terraplenagem\n  - especifico-eng\n---\n# 🏗️ Geotecnia e Obras de Terra\n\n> [!NOTE]\n> Este assunto faz parte dos **Conhecimentos Específicos Direcionados** (40 questões na prova).\n\n## 1. Topografia\n### Conceitos-chave\n- **Planimetria:** Medição de projeções horizontais (distâncias horizontais, ângulos horizontais).\n- **Altimetria:** Medição de distâncias verticais e diferenças de nível (cotas, altitudes).\n- **Nivelamento:** \n  - *Geométrico:* Uso de nível e mira (mais preciso).\n  - *Trigonométrico:* Uso de teodolito/estação total e distanciômetro.\n- **Curvas de nível:** Linhas que unem pontos de mesma cota. Quanto mais próximas, mais íngreme o terreno.\n- **GPS e Estação Total:** Equipamentos modernos para levantamentos de alta precisão.\n\n> [!TIP] Dica de Prova\n> Diferencie bem planimetria (eixos X e Y) de altimetria (eixo Z). Em nivelamento geométrico, o erro de fechamento é distribuído proporcionalmente às distâncias.\n\n## 2. Mecânica dos Solos\n### Índices Físicos e Classificação\n- **Índices Físicos:** Porosidade ($n$), índice de vazios ($e$), grau de saturação ($S$), teor de umidade ($w$). $S \\cdot e = w \\cdot G_s$.\n- **Classificação:**\n  - **SUCS** (Sistema Unificado): Usa granulometria e Limites de Atterberg. Letras (G: cascalho, S: areia, M: silte, C: argila, O: orgânico, W: bem graduado, P: mal graduado, H: alta plasticidade, L: baixa plasticidade).\n  - **TRB/HRB** (Rodoviário): Classifica de A-1 a A-7.\n- **Compactação (Proctor):** Busca-se a umidade ótima para a densidade máxima seca.\n- **Permeabilidade:** Lei de Darcy ($v = k \\cdot i$). Ensaios de carga constante (solos granulares) e variável (argilas).\n- **Adensamento:** Redução de volume pela expulsão da água ao longo do tempo (típico de argilas saturadas).\n- **Resistência ao Cisalhamento (Mohr-Coulomb):** $\\tau = c + \\sigma \\cdot \\tan(\\phi)$. \n- **Tensões e Empuxos:** Tensão total = Tensão Efetiva + Poro-pressão ($\\sigma = \\sigma' + u$). Empuxo ativo (solo expande), passivo (solo comprimido), repouso.\n\n## 3. Obras de Terra\n- **Barragens de terra:** Uso de materiais argilosos (núcleo impermeável) e granulares. \n- **Filtros e Drenos:** Evitam o *piping* (erosão interna) e reduzem a poro-pressão a jusante, usando as regras de Terzaghi (granulometria).\n- **Aterros e Diques:** Estruturas lineares de contenção e elevação.\n\n## 4. Obras de Contenção\n- **Muros de gravidade:** Usam o próprio peso para resistir ao empuxo (concreto ciclópico, gabião, flexão em concreto armado).\n- **Cortinas atirantadas e solo grampeado:** Técnicas que usam inclusões no solo (tirantes pré-tensionados ou chumbadores passivos).\n- **Gabião:** Gaiolas de malha de aço preenchidas com pedras, altamente drenantes e flexíveis.\n\n## 5. Fundações\n- **Rasas/Diretas:** Transmitem a carga pela base. Sapatas (isolada, corrida), radier (laje única), blocos.\n- **Profundas:** Transmitem carga pela base e atrito lateral. \n  - *Estacas:* Pré-moldadas, Franki (base alargada), Strauss, hélice contínua.\n  - *Tubulões:* Base alargada, executados a céu aberto (secos) ou sob ar comprimido (com lençol freático).\n- **SPT (Standard Penetration Test):** Ensaio de percussão (N_SPT), a cada metro. O N é o nº de golpes pros últimos 30cm.\n- **Capacidade de carga e recalques:** Cálculo por Terzaghi. Recalques diferenciais geram fissuras.\n\n## 6. Terraplenagem\n- **Processos:** Corte, transporte, aterro e compactação.\n- **Diagrama de Brückner (Massas):** Gráfico de volumes acumulados. Subidas indicam corte, descidas indicam aterro. \n- A linha de distribuição e momento de transporte são cruciais.\n\n## 7. Jazidas e Bota-fora\n- **Jazidas:** Locais de extração de material para aterro.\n- **Bota-fora:** Locais de descarte de material inadequado ou excedente.\n- Necessário controle ambiental rigoroso e recuperação de áreas degradadas (PRAD).\n\n## 8. Equipamentos\n- **Escavadeiras:** Escavação de baixo para cima ou em profundidade.\n- **Pá carregadeira:** Carregamento de material solto.\n- **Motoniveladora (Patrol):** Espalhamento, nivelamento e corte superficial.\n- **Rolo compactador:** Pé-de-carneiro (argilas), liso (areias/acabamento), pneumático.\n\n## NBRs Relevantes\n- **NBR 6122:** Projeto e execução de fundações.\n- **NBR 11682:** Estabilidade de encostas.\n- **NBR 6484:** Sondagem de simples reconhecimento com SPT.\n- **NBR 5629:** Estruturas atirantadas.\n\n## Checklist de Revisão\n- [ ] Entender a fórmula dos índices físicos e classificação HRB e SUCS.\n- [ ] Diferenciar os ensaios SPT e as propriedades de argilas vs areias.\n- [ ] Compreender métodos de compactação e umidade ótima.\n- [ ] Interpretar o Diagrama de Brückner.\n- [ ] Decorar os tipos de fundações rasas e profundas.\n"}, {"id": "10-materiais", "title": "🧱 Materiais e Tecnologia da Construção", "category": "Engenharia Civil", "fileName": "10 - Materiais e Tecnologia da Construção.md", "content": "---\ntags:\n  - materiais\n  - construcao\n  - patologia\n  - especifico-eng\n---\n# 🧱 Materiais e Tecnologia da Construção\n\n## 1. Materiais de Construção\n- **Concreto:** Mistura de cimento, água, agregados (miúdo/areia, graúdo/brita).\n  - *Dosagem (Traço):* Proporção dos materiais. Fator a/c (água/cimento) afeta diretamente a resistência.\n  - *Cura:* Fundamental para hidratação do cimento, evita retração.\n- **Aço:** CA-50 (f_{yk} = 500 MPa, nervurado) e CA-60 (f_{yk} = 600 MPa, liso/entalhado).\n- **Madeira:** Material anisotrópico. Resistência varia com a direção das fibras.\n- **Alvenaria, Argamassa, Cerâmica:** Argamassas têm aglomerante e agregado miúdo. Tijolos e blocos cerâmicos.\n- **Polímeros e Vidro:** Tintas, PVC, impermeabilizantes.\n\n## 2. Controle Tecnológico\n- **Slump test (Abatimento):** Mede a consistência e trabalhabilidade do concreto fresco.\n- **Compressão (CPs):** Ensaios de corpos de prova (cilíndricos no Brasil) aos 28 dias para obter o $f_{ck}$.\n- **Rastreabilidade:** Controle de lotes de aço, concreto e outros para garantir qualidade (PBQP-H).\n\n## 3. Tecnologia das Construções e 4. Canteiro de Obras\n- **Etapas:** Serviços preliminares $\\rightarrow$ fundação $\\rightarrow$ estrutura $\\rightarrow$ vedações $\\rightarrow$ instalações $\\rightarrow$ acabamentos.\n- **Canteiro (NR-18):** Planejamento físico, fluxo de materiais e pessoas. Instalações provisórias (refeitório, vestiário, almoxarifado). \n- **Logística:** Gruas, elevadores de cremalheira, gruas de torre.\n\n## 5. Recebimento e Controle\n- Inspeção visual, ensaios de recebimento, armazenamento em pilhas adequadas.\n- **Cimento:** Local seco, empilhado em estrados (máx. 10 sacos).\n\n## 6. Sistemas Construtivos\n- **Concreto armado:** Boa resistência à compressão (concreto) e tração (aço).\n- **Concreto protendido:** Aço pré-tensionado para comprimir o concreto e evitar fissuração, permitindo grandes vãos.\n- **Alvenaria estrutural:** Blocos resistem às cargas; não usa vigas e pilares tradicionais. Paredes não podem ser removidas.\n- **Steel Frame / Wood Frame:** Construção a seco, leve e rápida.\n- **Pré-moldados:** Peças fabricadas fora do local de uso final. Agilidade, menor desperdício.\n\n## 7. Patologia e Manutenção\n- **Corrosão de armadura:** Oxidação do aço gera aumento de volume e expulsa o cobrimento. Causa: carbonatação ou íons cloreto.\n- **Fissuras:** Devido a retração, recalque diferencial, variações térmicas ou esforços excessivos.\n- **Eflorescência:** Manchas brancas na superfície por sais solúveis levados pela água.\n- **Carbonatação:** Redução do pH do concreto pelo CO2 do ar, despassivando a armadura.\n- **RAA (Reação Álcali-Agregado):** Reação química expansiva no concreto.\n- **Manutenção:** Preventiva (programada) vs. Corretiva (após falha). NBR 5674.\n\n## 8. Reformas e Retrofit\n- **Reforço Estrutural:** Uso de fibra de carbono, chapa colada, aumento de seção.\n- **Retrofit:** Modernização e adequação tecnológica, mantendo a arquitetura/estrutura original.\n\n## 9. Resistência dos Materiais\n- **Tensão ($\\sigma$):** Força por unidade de área.\n- **Deformação ($\\epsilon$):** Variação de comprimento relativa.\n- **Lei de Hooke:** $\\sigma = E \\cdot \\epsilon$ (E = Módulo de Elasticidade).\n- **Esforços:** Tração/Compressão (axial), Cisalhamento (cortante), Flexão (momento fletor, fibras tracionadas e comprimidas), Torção, Flambagem (peças esbeltas comprimidas).\n\n## NBRs Relevantes\n- **NBR 12655:** Concreto de cimento Portland – Preparo, controle, recebimento.\n- **NBR 15575:** Norma de Desempenho (vida útil, acústica, térmica).\n- **NBR 6136 e 15961:** Alvenaria estrutural.\n- **NBR 5674:** Manutenção de edificações.\n\n## Checklist de Revisão\n- [ ] Relembrar a influência do fator a/c na resistência e porosidade do concreto.\n- [ ] Entender a diferença entre alvenaria de vedação e estrutural.\n- [ ] Conhecer as patologias ligadas à corrosão (carbonatação e cloretos).\n- [ ] Revisar diagramas tensão-deformação e os módulos (Hooke, escoamento, ruptura).\n"}, {"id": "11-projetos-estruturas", "title": "📐 Projetos, Instalações e Estruturas", "category": "Engenharia Civil", "fileName": "11 - Projetos, Instalações e Estruturas.md", "content": "---\ntags:\n  - projetos\n  - instalacoes\n  - estruturas\n  - especifico-eng\n---\n# 📐 Projetos, Instalações e Estruturas\n\n## PARTE 1: PROJETOS E INSTALAÇÕES\n\n### 1. Projetos de Obras Civis\n- Compatibilização de projetos (BIM é essencial).\n- Envolve projetos de arquitetura, fundações, estrutura, instalações (MEP - Mecânica, Elétrica, Hidráulica).\n\n### 2. Instalações Hidrossanitárias (NBR 5626, NBR 8160, NBR 10844)\n- **Água fria e quente:** Pressão estática máxima (40 m.c.a) e dinâmica mínima. Uso do método dos pesos (Hunter) para vazão de projeto.\n- **Esgoto:** Uso de fecho hídrico (sifão, ralo sifonado) para evitar retorno de gases. Ventilação sanitária é obrigatória.\n- **Águas Pluviais:** Dimensionamento de calhas e condutores usando a chuva de projeto (Tempo de Retorno e Intensidade).\n\n### 3. Instalações Elétricas (NBR 5410)\n- **Critérios de dimensionamento:** Capacidade de condução de corrente, queda de tensão admissível.\n- **Componentes:** Disjuntores termomagnéticos (proteção contra curto e sobrecarga), DR (Diferencial Residual - choque elétrico), DPS (Surtos).\n- **Aterramento:** Sistemas TN, TT, IT. O TN-S (neutro e proteção separados) é um dos mais usados.\n\n### 4. Instalações de Gás (NBR 15526, NBR 13523)\n- **GLP (Gás Liquefeito de Petróleo):** Mais pesado que o ar. Recipientes em área externa e ventilada.\n- **GN (Gás Natural):** Mais leve que o ar. \n\n### 5. Prevenção e Combate a Incêndio (PPCI)\n- **Componentes:** Extintores, hidrantes, mangotinhos, chuveiros automáticos (*sprinklers*).\n- **SPDA (Para-raios):** NBR 5419. Gaiola de Faraday, método de Franklin, esfera rolante.\n- **Rotas de Fuga:** NBR 9077. Portas corta-fogo, sinalização, escadas enclausuradas.\n\n### 6. Obras de Arte Especiais\n- **Pontes e Viadutos:** Superestrutura (tabuleiro), mesoestrutura (pilares) e infraestrutura (fundações). \n- Sujeitos a cargas móveis (Linhas de Influência - Trem tipo).\n\n---\n\n## PARTE 2: ESTRUTURAS\n\n### 1. Concreto Armado (NBR 6118)\n- **Domínios de deformação:** Domínio 2 (aço escoa, concreto não rompe), Domínio 3 (ruptura simultânea ou aço escoa e concreto rompe - o ideal), Domínio 4 (concreto rompe sem escoamento do aço - frágil, evitar!).\n- **Cobrimento:** Protege a armadura (varia com a Classe de Agressividade Ambiental).\n- **Esforços:** \n  - Flexão: Armadura longitudinal.\n  - Cisalhamento: Estribos (armadura transversal).\n\n### 2. Estruturas Metálicas (NBR 8800) e Mistas\n- Aço estrutural (ASTM A36, A572).\n- Ligações por solda (filete, penetração) ou parafusos (alta resistência, AR).\n- **Mistas:** Viga de aço + Laje de concreto conectadas por *stud bolts* (conectores de cisalhamento). \n\n### 3. Mecânica das Estruturas e Análise\n- **Equilíbrio da estática:** $\\sum F_x = 0$, $\\sum F_y = 0$, $\\sum M = 0$.\n- **Vínculos:** Apoios de 1º grau (móvel), 2º grau (fixo), 3º grau (engaste).\n- **Diagramas:**\n  - N (Normal): Tração e compressão.\n  - V ou Q (Cortante): Variação linear em carga distribuída, constante em cargas pontuais.\n  - M (Momento Fletor): Máximo onde a cortante é zero.\n- **Estruturas Isostáticas:** Resolvidas por equações de equilíbrio.\n- **Estruturas Hiperestáticas:** Requerem métodos como Processo de Cross, Método das Forças, Método dos Deslocamentos.\n\n## NBRs Relevantes\n- **NBR 6118:** Projeto de estruturas de concreto.\n- **NBR 8800:** Estruturas de aço e estruturas mistas de aço e concreto.\n- **NBR 6120:** Cargas para cálculo de estruturas.\n- **NBR 8681:** Ações e segurança nas estruturas.\n\n## Checklist de Revisão\n- [ ] Compreender os limites de pressão na rede de água fria.\n- [ ] Diferenciar os disjuntores, DR e DPS nas instalações elétricas.\n- [ ] Revisar cálculo de reações de apoio de vigas biapoiadas e engastadas.\n- [ ] Entender perfeitamente os Domínios de deformação (especialmente 2 e 3) do concreto armado.\n"}, {"id": "12-orcamento", "title": "💰 Orçamento, Planejamento e Fiscalização", "category": "Engenharia Civil", "fileName": "12 - Orçamento, Planejamento e Fiscalização de Obras.md", "content": "---\ntags:\n  - orcamento\n  - planejamento\n  - fiscalizacao\n  - obras\n  - especifico-eng\n---\n# 💰 Orçamento, Planejamento e Fiscalização de Obras\n\n> [!IMPORTANT]\n> Este é um dos temas MAIS cobrados pela Cesgranrio. O domínio das metodologias e legislações é fundamental.\n\n## 1. Orçamento de Obras\nA elaboração do orçamento envolve o levantamento das quantidades e a determinação dos custos diretos e indiretos.\n- **Composição de Custos Unitários**: Define o custo de cada serviço com base nos insumos de **Material, Mão de obra e Equipamento**.\n- **CUB (Custo Unitário Básico)**: Índice publicado pelos Sinduscons.\n- **SINAPI e SICRO**: Principais sistemas de referência de custos (SINAPI para obras civis, SICRO para infraestrutura/transportes).\n- **Orçamento Sintético**: Resumo dos serviços principais.\n- **Orçamento Analítico**: Detalhamento com as composições unitárias.\n\n## 2. BDI (Benefícios e Despesas Indiretas)\nO BDI cobre custos que não podem ser diretamente atribuídos a serviços específicos.\n- **Composição**: Administração central, lucro (remuneração), impostos, riscos e despesas financeiras.\n- **Acórdão TCU 2622/2013**: Define faixas aceitáveis para as taxas de BDI conforme a tipologia da obra.\n\n### Fórmulas Importantes\n$$ BDI = \\left[ \\frac{(1 + AC + S + R + G)(1 + DF)(1 + L)}{1 - I} - 1 \\right] \\times 100 $$\n*(Onde: AC = Administração Central, S = Seguros, R = Riscos, G = Garantias, DF = Despesas Financeiras, L = Lucro, I = Impostos)*\n\n## 3. Encargos Sociais\nCustos incidentes sobre a folha de pagamento da mão de obra.\n- **Composição**: Encargos básicos (INSS, FGTS), trabalhistas (férias, 13º, rescisão), indenizatórios e taxas de incidência.\n- **Horistas vs. Mensalistas**: Horistas possuem taxas de encargos maiores devido a repouso remunerado e outras particularidades não incorporadas no salário base.\n\n## 4. Planejamento de Obras\n- **WBS / EAP (Estrutura Analítica do Projeto)**: Decomposição hierárquica do trabalho.\n- **Caminho Crítico**: Sequência de atividades com folga zero. Um atraso nestas atrasa a obra inteira.\n\n## 5. Cronogramas e Redes\n- **Gantt**: Gráfico de barras simples e intuitivo.\n- **PERT/CPM**: Método das setas ou blocos para calcular durações e folgas. Foca em prazos.\n- **Redes de Atividades**: Representação gráfica de predecessoras e sucessoras.\n\n## 6. Curvas de Controle\n- **Curva S**: Gráfico acumulado do avanço físico e/ou financeiro ao longo do tempo.\n- **Curva ABC**: Classificação de insumos/serviços pelo seu peso financeiro (A: mais importantes, C: menos).\n\n## 7. Fluxo de Caixa\n- Projeção de entradas e saídas de recursos durante a obra. Fundamental para a viabilidade e gestão financeira.\n\n## 8. Acompanhamento e Controle\n- **Controle Físico-Financeiro**: Comparação entre planejado e realizado (medido).\n- **Medições**: Aferição in loco do que foi efetivamente executado.\n\n## 9. Licitações e Contratos (Lei 14.133/2021)\n- **Modalidades**: Concorrência, Concurso, Leilão, Pregão e Diálogo Competitivo.\n- **Critérios de Julgamento**: Menor preço, maior desconto, técnica e preço, etc.\n- **Garantias**: Podem chegar a 5% (regra) ou 10% (obras de grande vulto e complexidade técnica), em seguro, fiança ou caução.\n\n## 10. Medição de Obras e Boletim\n- **Critérios de Medição**: Definidos no edital/contrato. Como se mede a alvenaria? Desconta vãos?\n- **Boletim de Medição**: Documento base para a emissão da nota fiscal e faturamento.\n\n## 11. Fiscalização\n- **Atribuições**: O fiscal garante a conformidade ao projeto, especificações e normas.\n- **Diário de Obra**: Registro obrigatório e oficial das ocorrências diárias (clima, efetivo, avanços).\n- **Ensaios**: Conferência de controle tecnológico.\n\n## 12. Aditivos Contratuais e Reequilíbrio\n- **Limites (Lei 14.133)**: Acréscimos de até 25% (regra) ou 50% (reformas em edifícios/equipamentos).\n- **Reajustamento**: Atualização prevista para corrigir inflação baseada em índices.\n- **Reequilíbrio Econômico-Financeiro**: Em caso de fatos imprevisíveis que afetem a álea econômica.\n\n## 13. Perícias e Laudos\n- **Perito**: Nomeado pelo juiz, isento.\n- **Assistente Técnico**: Contratado pelas partes.\n- **Quesitos**: Perguntas técnicas que o perito deve responder.\n\n## 14. Sistema Internacional (SI)\n- Compreensão das unidades e conversões essenciais (MPa para kgf/cm², etc).\n\n## 15. Qualidade: PBQP-H e ISO 9001\n- Sistemas de gestão para melhorar processos, qualificar materiais e reduzir perdas.\n\n## 16. Produtividade\n- **TCPO**: Tabelas de Composições de Preços para Orçamentos (Pini).\n- **RUP**: Razão Unitária de Produção. (homem-hora/unidade de serviço).\n\n## 17. Decreto 7.983/2013\n- Regulamenta a elaboração dos orçamentos para contratação de obras pela União (usando SINAPI, SICRO, critérios de BDI, etc.).\n\n---\n## Checklist de Estudos\n- [ ] Entender a composição e fórmulas do BDI e Encargos\n- [ ] Diferenciar SINAPI e SICRO\n- [ ] Ler a Nova Lei de Licitações focada em obras e engenharia\n- [ ] Calcular caminho crítico em um PERT/CPM\n- [ ] Interpretar a Curva ABC e a Curva S\n"}, {"id": "13-avaliacao", "title": "🏠 Avaliação Imobiliária (NBR 14653/AVM)", "category": "Engenharia Civil", "fileName": "13 - Avaliação Imobiliária.md", "content": "---\ntags:\n  - avaliacao\n  - imoveis\n  - nbr14653\n  - especifico-eng\n---\n# 🏠 Avaliação Imobiliária\n\n> [!WARNING]\n> Tópicos modernos como AVM (Automated Valuation Models) e Machine Learning são novidades em editais recentes e requerem atenção especial para questões conceituais!\n\n## 1. NBR 14.653 (Avaliação de Bens)\nNorma fundamental para avaliações:\n- **Parte 1 (Procedimentos Gerais)**: Define o valor de mercado, valor em risco, custo de reprodução e reposição.\n- **Parte 2 (Imóveis Urbanos)**: Especifica os métodos de avaliação para áreas urbanas e os graus de fundamentação/precisão.\n- **Parte 3 (Imóveis Rurais)**: Adapta os conceitos à produtividade e uso da terra.\n- **Parte 4 (Empreendimentos)**: Avaliação de base de fluxo de caixa e potencial comercial.\n\n## 2. Métodos de Avaliação\n- **Comparativo Direto de Dados de Mercado**: O mais utilizado e recomendado. Consiste em comparar o imóvel a propriedades semelhantes negociadas no mercado. Utiliza regressão linear e homogeneização.\n- **Método Involutivo**: Baseado no estudo de viabilidade técnico-econômica de um projeto hipotético para o terreno, subtraindo os custos e lucro do valor de venda. Utilizado para glebas e terrenos grandes.\n- **Método Evolutivo**: Soma o valor do terreno (comparativo) ao valor das benfeitorias (custo de reedição, descontando depreciação). Comum para imóveis atípicos (escolas, hospitais, fábricas).\n- **Capitalização da Renda**: Calcula o valor presente de um fluxo futuro de receitas líquidas esperado para a propriedade.\n\n## 3. O Produto Imobiliário\n- Estudo focado em entender as demandas do mercado, localização, público-alvo, tipologias e padrão construtivo ideal.\n\n## 4. Plano de Negócios e Comercialização\n- Projeta o ritmo de vendas (velocidade de vendas - VGV), custos de marketing, comissionamentos e estratégias de lançamento.\n\n## 5. EVTEA (Estudo de Viabilidade Técnico-Econômica e Ambiental)\n- Avalia se um projeto deve ou não ser realizado baseando-se em métricas financeiras (VPL, TIR, Payback), restrições ambientais, viabilidade física e legal.\n\n## 6. Incorporação Imobiliária (Lei 4.591/64)\n- **Conceito**: Atividade de promover a construção de edificações compostas de unidades autônomas, alienando-as antes de concluídas.\n- Envolve o Patrimônio de Afetação e o papel do incorporador.\n\n## 7. Parcelamento do Solo Urbano (Lei 6.766/79)\n- **Loteamento**: Subdivisão de gleba com a **abertura** ou ampliação/prolongamento de vias públicas de circulação.\n- **Desmembramento**: Subdivisão de gleba com aproveitamento do sistema viário **existente** (não abre novas ruas).\n- Requisitos básicos de áreas públicas institucionais e áreas verdes.\n\n## 8. Aprovações e Licenças\n- Etapas legais: Alvará de construção, licenciamento ambiental (LP, LI, LO), anuência prévia, Habite-se.\n\n## 9. Coleta de Dados\n- Formas de conseguir dados para amostragem: plataformas imobiliárias, corretores, registros de cartórios, pesquisas in loco. O cuidado na eliminação de _outliers_ e dados tendenciosos é essencial.\n\n## 10. AVM e Machine Learning na Avaliação\n- **AVM (Automated Valuation Model)**: Sistemas de software que fornecem estimativas de valor usando modelagem matemática e bases de dados, sem intervenção direta do avaliador para cada laudo.\n- **Modelos Avançados**:\n  - **Random Forest**: Algoritmo de florestas aleatórias (conjunto de árvores de decisão). Robusto para precificação pois lida bem com relações não lineares de características do imóvel.\n  - **Gradient Boosting**: Técnica iterativa de aprendizado de máquina que reduz erros de árvores anteriores, criando um modelo final preditivo muito preciso para o valor de mercado.\n\n---\n## Checklist de Estudos\n- [ ] Conhecer os graus de fundamentação e precisão da NBR 14.653\n- [ ] Diferenciar os 4 principais métodos (Comparativo, Involutivo, Evolutivo e Renda)\n- [ ] Entender a diferença entre Loteamento e Desmembramento (Lei 6.766)\n- [ ] Ler conceitos básicos sobre AVM, VPL e TIR\n"}, {"id": "14-pavimentacao", "title": "🛣️ Pavimentação, Vias e Mobilidade", "category": "Engenharia Civil", "fileName": "14 - Pavimentação, Vias e Mobilidade.md", "content": "---\ntags:\n  - pavimentacao\n  - vias\n  - mobilidade\n  - especifico-eng\n---\n# 🛣️ Pavimentação, Vias, Transporte e Mobilidade\n\n## 1. Materiais para Pavimentação\n- **Agregados**: Brita, areia, filler.\n- **Ligantes Asfálticos**:\n  - **CAP (Cimento Asfáltico de Petróleo)**: Utilizado em misturas a quente (CBUQ).\n  - **Emulsões Asfálticas**: Misturas de CAP e água com agentes tensoativos. Usadas a frio (pinturas de ligação, lama asfáltica).\n- **Cimento Portland**: Usado em pavimentos rígidos, sub-bases tratadas (solo-cimento).\n\n## 2. Pavimentos Flexíveis\n- Deformam-se de forma elástica, distribuindo as cargas para as camadas inferiores de maneira concentrada.\n- **Camadas** (de baixo para cima): Subleito, Reforço do Subleito, Sub-base, Base, Revestimento (ex: CBUQ, TSS).\n- **Dimensionamento**: O método empírico DNER/DNIT considera o Número N (tráfego) e o CBR (Índice de Suporte Califórnia) do solo.\n\n## 3. Pavimentos Rígidos\n- Elevada rigidez, distribuem a carga em uma grande área. Basicamente placas de concreto sobre sub-base.\n- **Juntas**: Necessárias para controlar retração, expansão e empenamento térmico (juntas de dilatação, retração e construção).\n- **Barras de Transferência (Dowels)**: Transmitem cargas cortantes de uma placa para outra sem impedir a movimentação longitudinal.\n\n## 4. Controle Tecnológico\n- **Marshall**: Dimensionamento e controle de misturas asfálticas a quente. Avalia estabilidade e fluência.\n- **CBR (California Bearing Ratio)**: Avalia a capacidade de suporte do solo e sua expansão.\n- **Grau de Compactação**: Relação entre o peso específico seco no campo e o obtido no ensaio de Proctor.\n\n## 5. Patologia de Pavimentos\n- **Trincas**: Fadiga (couro de jacaré), retração térmica.\n- **Panelas (Buracos)**: Degradação completa do revestimento atingindo a base.\n- **Afundamentos**: Plásticos (fluência do CBUQ) ou de consolidaç
