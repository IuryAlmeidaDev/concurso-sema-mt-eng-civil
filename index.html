ão (falha estrutural nas camadas inferiores).\n- **Corrugação (Costela de vaca)**: Ondulações transversais causadas por excesso de asfalto ou deformação da mistura.\n\n## 6. Manutenção\n- **Recapeamento**: Adição de nova camada estrutural.\n- **Fresagem**: Remoção controlada da camada superficial degradada antes da recomposição.\n- **Reciclagem**: Reutilização do material fresado (RAP).\n- **Tapa-Buraco**: Medida corretiva paliativa e pontual.\n\n## 7. Geometria de Vias\n- **Alinhamento Horizontal**: Tangentes, curvas circulares e curvas de transição (clotoide).\n- **Alinhamento Vertical**: Greide, rampas e curvas verticais (côncavas e convexas).\n- **Seção Transversal**: Pista de rolamento, acostamento, canteiro, taludes.\n- **Superelevação**: Inclinação transversal nas curvas para contrabalançar a força centrífuga.\n\n## 8. Vias Vicinais\n- Estradas rurais ou secundárias de baixo volume de tráfego, geralmente sem revestimento asfáltico. Importantes para escoamento agrícola.\n\n## 9. Drenagem\n- **Superficial**: Captura e direciona águas da chuva (meio-fio, sarjetas, valetas, bueiros).\n- **Profunda / Subsuperficial**: Rebaixa o lençol freático e drena a água das camadas do pavimento (drenos profundos e cegos).\n\n## 10. Sinalização Viária e Segurança\n- **Horizontal**: Pinturas, tachas (ex: marcas longitudinais, faixas de pedestre).\n- **Vertical**: Placas (regulamentação, advertência, indicação).\n- **Dispositivos de Segurança**: Defensas metálicas (guard-rails), barreiras de concreto (New Jersey), atenuadores de impacto.\n\n## 11. Obras de Arte Especiais (OAE)\n- **Pontes**: Ultrapassam obstáculos aquáticos.\n- **Viadutos**: Ultrapassam outras vias terrestres.\n- **Bueiros**: Estruturas de drenagem e passagem sob aterros.\n\n## 12. Mobilidade Urbana\n- **Intermodalidade e Multimodalidade**: Integração entre diferentes modos de transporte (ônibus, metrô, bicicleta).\n- **Transporte Coletivo**: BRT, VLT, metrô, faixas exclusivas.\n- **Acessibilidade e Calçadas**: Desenho universal, piso tátil.\n- **Mobilidade Ativa**: Ciclovias, ciclofaixas.\n\n## 13. Estudos de Viabilidade\n- Avaliação de demanda, capacidade viária, níveis de serviço (LOS de A a F), e benefícios socioeconômicos para justificar investimentos em infraestrutura.\n\n---\n## Checklist de Estudos\n- [ ] Diferenciar componentes de pavimentos flexíveis e rígidos\n- [ ] Entender os ensaios de CBR e Marshall\n- [ ] Diferenciar os tipos de patologias asfálticas\n- [ ] Compreender os conceitos de geometria de vias (superelevação, greide)\n- [ ] Ler diretrizes de mobilidade sustentável e acessibilidade\n"}, {"id": "15-sustentabilidade", "title": "♻️ Sustentabilidade e Acessibilidade", "category": "Engenharia Civil", "fileName": "15 - Sustentabilidade e Acessibilidade.md", "content": "---\ntags:\n  - sustentabilidade\n  - acessibilidade\n  - nbr9050\n  - nbr15575\n  - especifico-eng\n---\n\n# ♻️ Sustentabilidade, Acessibilidade e Conforto\n\n> [!NOTE]\n> Este documento abrange os principais conceitos de sustentabilidade, desempenho e acessibilidade em edificações, cobrados frequentemente em concursos de Engenharia Civil.\n\n## 1. Sustentabilidade na Construção Civil\n- **Conceitos:** Redução do impacto ambiental, eficiência energética, uso racional da água, ciclo de vida dos materiais.\n- **Certificações Ambientais:** \n  - **LEED** (Leadership in Energy and Environmental Design): Sistema internacional de certificação e orientação ambiental.\n  - **AQUA-HQE** (Alta Qualidade Ambiental): Certificação baseada no sistema francês, adaptado à realidade brasileira pela Fundação Vanzolini.\n- **Materiais Sustentáveis:** Materiais reciclados, recicláveis, de baixo impacto ambiental, com baixa emissão de compostos orgânicos voláteis (COV).\n- **Gestão de Resíduos de Construção e Demolição (RCC):** Resolução CONAMA 307. Classificação em Classes A, B, C e D.\n- **Demolição Seletiva:** Processo de desconstrução que visa a separação de materiais na origem para maximizar o reaproveitamento e reciclagem.\n\n## 2. NBR 9050 - Acessibilidade\n- **Rampas:** Inclinação máxima permitida de 8,33% (para desníveis maiores). Fórmulas de cálculo de inclinação $i = (h/c) \\times 100$.\n- **Larguras Mínimas:** Em corredores de uso público e coletivo, mínimo de 1,20 m (para locais sem obstáculos).\n- **Sanitários Acessíveis:** Dimensões mínimas para rotação (1,50 m de diâmetro), barras de apoio, altura da bacia.\n- **Sinalização Tátil:** Piso tátil de alerta e direcional.\n- **Vagas PCD:** Sinalização horizontal e vertical, área de circulação adjacente (faixa de embarque/desembarque de 1,20 m).\n- **Circulação Vertical (Elevador):** Dimensões mínimas da cabine, tempo de abertura de portas, sinalização braile e sonora.\n- **Módulo de Referência:** Projeção no piso ocupada por uma pessoa em cadeira de rodas, medindo 0,80 m x 1,20 m.\n\n## 3. NBR 15.575 - Desempenho de Edificações Habitacionais\n- **Partes 1 a 6:**\n  1. Requisitos gerais.\n  2. Requisitos para os sistemas estruturais.\n  3. Requisitos para os sistemas de pisos.\n  4. Requisitos para os sistemas de vedações verticais internas e externas.\n  5. Requisitos para os sistemas de coberturas.\n  6. Requisitos para os sistemas hidrossanitários.\n- **Vida Útil (VU) e Vida Útil de Projeto (VUP):** Período em que o edifício e seus sistemas se prestam às atividades para as quais foram projetados.\n- **Níveis de Desempenho:**\n  - **M** (Mínimo)\n  - **I** (Intermediário)\n  - **S** (Superior)\n\n## 4. Conforto Térmico\n- **Transmitância Térmica (U):** Quantidade de calor que atravessa um elemento construtivo. Quanto menor, maior o isolamento.\n- **Zoneamento Bioclimático (NBR 15220):** Divisão do território brasileiro em 8 zonas com diretrizes construtivas específicas para cada clima.\n- **Estratégias Passivas:** Ventilação cruzada, sombreamento, inércia térmica, resfriamento evaporativo.\n\n## 5. Conforto Acústico\n- **Isolamento Acústico:** Redução da transmissão de som entre ambientes (ex: uso de paredes duplas).\n- **Absorção Acústica:** Redução da reverberação dentro do ambiente (ex: uso de espumas, forros porosos).\n- **NR (Noise Criteria):** Curvas de avaliação de ruído de fundo em ambientes fechados.\n- **Classes de Ruído:** Conforme NBR 10151 e NBR 10152.\n\n## 6. Conforto Lumínico\n- **Iluminação Natural e Artificial:** Integração para eficiência energética.\n- **NBR 15215:** Iluminação natural.\n- **NBR 5413 / NBR ISO 8995-1:** Iluminância de interiores (níveis lux recomendados para diferentes ambientes de trabalho).\n\n## 7. Qualidade Ambiental\n- **ACV (Avaliação do Ciclo de Vida):** Metodologia para quantificar os impactos ambientais de um produto do \"berço ao túmulo\".\n- **Impactos da Construção:** Consumo de recursos naturais, emissões de gases de efeito estufa, geração de resíduos.\n\n## 8. Energia Solar Fotovoltaica\n- **Princípios:** Conversão de energia luminosa em energia elétrica (efeito fotovoltaico).\n- **Tipos de Painéis:**\n  - **Monocristalino:** Maior eficiência e custo.\n  - **Policristalino:** Menor custo, eficiência um pouco inferior.\n- **Inversor:** Converte a corrente contínua (CC) gerada pelos painéis em corrente alternada (CA) usada na rede.\n- **Sistemas:**\n  - **On-grid:** Conectado à rede elétrica da concessionária.\n  - **Off-grid:** Autônomo, com uso de baterias para armazenamento.\n- **BIPV (Building-Integrated Photovoltaics):** Integração dos módulos na arquitetura da edificação (fachadas, coberturas).\n- **Impacto Ambiental:** Fonte limpa, mas com impactos na fabricação e descarte dos painéis.\n- **Regulamentação:** Resolução Normativa (REN) 482 e 1000 da ANEEL (Geração Distribuída).\n\n> [!TIP]\n> Em provas, atente-se às inclinações máximas da NBR 9050 e aos níveis de desempenho da NBR 15575.\n\n---\n\n### Checklist de Estudo\n- [ ] Revisar conceitos de certificação LEED e AQUA\n- [ ] Memorizar medidas da NBR 9050 (rampas, módulo de referência)\n- [ ] Entender os três níveis de desempenho da NBR 15575\n- [ ] Ler diretrizes do Zoneamento Bioclimático da NBR 15220\n- [ ] Estudar as diferenças entre sistemas fotovoltaicos On-grid e Off-grid\n"}, {"id": "16-hidraulica", "title": "💧 Hidráulica, Hidrologia e Saneamento", "category": "Engenharia Civil", "fileName": "16 - Hidráulica, Hidrologia e Saneamento.md", "content": "---\ntags:\n  - hidraulica\n  - hidrologia\n  - saneamento\n  - especifico-eng\n---\n\n# 💧 Hidráulica, Hidrologia e Saneamento\n\n> [!NOTE]\n> Área de grande relevância, exigindo domínio tanto teórico (ciclo hidrológico) quanto prático (cálculo de perdas de carga e dimensionamento).\n\n## 1. Hidráulica Geral\n- **Estática dos Fluidos:** Lei de Stevin, Princípio de Pascal, empuxo (Arquimedes).\n- **Cinemática:** Tipos de escoamento (laminar, turbulento, permanente, uniforme).\n- **Equação da Continuidade:** $Q = V_1 \\cdot A_1 = V_2 \\cdot A_2$.\n- **Teorema de Bernoulli:** Conservação de energia (carga de posição, carga de pressão, carga cinética).\n- **Perdas de Carga:** \n  - Fórmulas empíricas: **Hazen-Williams** (condutos forçados de água), **Darcy-Weisbach** (universal).\n- **Orifícios e Vertedores:** Fórmulas para cálculo de vazão. Tipos de vertedores (retangular, triangular, Cipolletti).\n- **Condutos Forçados:** Linha piezométrica e linha de energia.\n- **Canais:** Escoamento livre, fórmula de **Manning** ($V = \\frac{1}{n} \\cdot R_h^{2/3} \\cdot I^{1/2}$).\n\n## 2. Hidrologia Aplicada\n- **Ciclo Hidrológico:** Precipitação, evapotranspiração, infiltração, escoamento superficial e subterrâneo.\n- **Precipitação:** Chuvas de projeto, curvas IDF (Intensidade-Duração-Frequência), tempo de recorrência (TR).\n- **Infiltração:** Capacidade de infiltração do solo.\n- **Escoamento Superficial:** Fatores intervenientes.\n- **Hidrograma Unitário:** Resposta da bacia a uma chuva efetiva unitária.\n- **Tempo de Concentração ($t_c$):** Tempo para a água da chuva ir do ponto mais remoto até o exutório.\n- **Método Racional:** $Q = \\frac{C \\cdot i \\cdot A}{360}$ (para bacias pequenas, onde o $t_c$ é pequeno).\n\n## 3. Sistemas de Abastecimento de Água\n- **Componentes:** Captação (superficial/subterrânea) $\\rightarrow$ Adução $\\rightarrow$ ETA $\\rightarrow$ Reservação $\\rightarrow$ Distribuição.\n- **Tratamento (ETA):**\n  1. Coagulação (adição de sulfato de alumínio, mistura rápida)\n  2. Floculação (mistura lenta)\n  3. Decantação\n  4. Filtração\n  5. Desinfecção/Fluoretação\n\n## 4. Sistemas de Esgotamento Sanitário\n- **Coleta:** Sistema separador absoluto (esgoto separado da água pluvial).\n- **Transporte e Estações Elevatórias:** Bombeamento de esgoto para vencer desníveis.\n- **Tratamento (ETE):**\n  - **Preliminar:** Gradeamento, desarenador (remoção de sólidos grosseiros e areia).\n  - **Primário:** Decantadores primários (remoção de sólidos suspensos sedimentáveis).\n  - **Secundário:** Processos biológicos (lodos ativados, lagoas de estabilização, reatores UASB) para remoção de matéria orgânica (DBO).\n  - **Terciário:** Remoção de nutrientes (N e P), patógenos.\n- **Reuso:** Uso de efluentes tratados para fins não potáveis.\n\n## 5. Drenagem Pluvial\n- **Micro e Macrodrenagem:** \n  - Micro: sistema inicial de captação (guias, sarjetas, bocas de lobo).\n  - Macro: galerias tronco, canais, bacias de detenção/retenção.\n- **Dimensionamento de Galerias:** Velocidade mínima e máxima, declividade.\n- **Componentes:** Poços de visita (PV), caixas de captação, dissipadores de energia.\n\n## 6. Aterros Sanitários\n- **Projeto:** Seleção de área, vida útil.\n- **Impermeabilização:** Manta PEAD, camada de argila (para evitar contaminação do lençol freático).\n- **Drenagem:** Sistema de coleta de chorume e de gases (biogás/metano).\n- **Monitoramento:** Poços de monitoramento a montante e jusante.\n\n## 7. Resíduos Sólidos\n- **Classificação (NBR 10004):** Classe I (Perigosos), Classe IIA (Não Inertes) e Classe IIB (Inertes).\n- **Gestão:** Coleta, transporte, tratamento e destinação final ambientalmente adequada.\n\n## 8. Marco Regulatório do Saneamento\n- **Lei 14.026/2020:** \n  - Metas de universalização (99% água potável e 90% coleta e tratamento de esgotos até 2033).\n  - Fim dos contratos de programa (obrigatoriedade de licitação).\n  - Regionalização dos serviços.\n  - Papel regulatório da ANA (Agência Nacional de Águas e Saneamento Básico).\n\n## 9. Estudos de Viabilidade em Saneamento\n- **EVTE (Estudo de Viabilidade Técnica e Econômica):** Avaliação de alternativas de projeto, análise de custos (CAPEX e OPEX), rentabilidade.\n\n> [!WARNING]\n> Confundir ETA com ETE é um erro comum. Memorize que ETA usa coagulação/floculação e ETE usa tratamento biológico (UASB, lodos ativados).\n\n---\n\n### Fórmulas Importantes\n- **Continuidade:** $Q = V \\cdot A$\n- **Hazen-Williams:** $V = 0,355 \\cdot C \\cdot D^{0,63} \\cdot J^{0,54}$\n- **Manning:** $Q = \\frac{1}{n} \\cdot A \\cdot R_h^{2/3} \\cdot I^{1/2}$\n- **Método Racional:** $Q = C \\cdot I \\cdot A$\n\n### Checklist de Estudo\n- [ ] Revisar tipos de escoamento e perdas de carga\n- [ ] Memorizar a fórmula do Método Racional\n- [ ] Entender todas as etapas de uma ETA e uma ETE\n- [ ] Revisar os conceitos de macro e microdrenagem\n- [ ] Ler os principais pontos da Lei 14.026/2020 (Marco do Saneamento)\n"}, {"id": "17-legislacao-eng", "title": "📜 Legislação de Engenharia e Urbanismo", "category": "Engenharia Civil", "fileName": "17 - Legislação de Engenharia e Urbanismo.md", "content": "---\ntags:\n  - licitacoes\n  - urbanismo\n  - politica-urbana\n  - especifico-eng\n---\n\n# 📜 Legislação de Engenharia, Urbanismo e Infraestrutura\n\n## 1. Licitações e Contratos\n\n### Lei 14.133/2021 (Nova Lei de Licitações)\n- **Modalidades:** Concorrência, Pregão, Concurso, Leilão e **Diálogo Competitivo** (nova modalidade). Toma de preços e convite deixaram de existir.\n- **Critérios de Julgamento:** Menor preço, maior desconto, melhor técnica ou conteúdo artístico, técnica e preço, maior lance, maior retorno econômico.\n- **Contratos:** Prazos, prorrogações, reajuste.\n- **Garantias:** Pode chegar até 30% em obras de grande vulto (cláusula de step-in).\n- **Alterações:** Limites de aditivos (25% obras e compras, 50% reformas).\n- **Inovações:** Exigência de uso de BIM (Building Information Modeling) preferencialmente.\n- **Orçamentação:** Referências do SINAPI (obras civis) e SICRO (obras rodoviárias).\n\n### Outras Leis de Contratação\n- **Lei 13.303/2016 (Estatais):** Regras específicas para empresas públicas e sociedades de economia mista.\n- **Lei 11.079/2004 (PPPs):** \n  - **Concessão Patrocinada:** Há tarifa cobrada dos usuários + contraprestação pecuniária do parceiro público.\n  - **Concessão Administrativa:** O parceiro público é o usuário direto ou indireto. Repartição de riscos e garantias.\n\n### Decreto 7.983/2013\n- Regras para elaboração do orçamento de referência de obras e serviços de engenharia com recursos federais.\n- Definição do uso do SINAPI e SICRO.\n- Composições de Custos Unitários, BDI (Benefícios e Despesas Indiretas) e Encargos Sociais.\n\n---\n\n## 2. Normas ABNT Principais\n- **NBR 6118:** Projeto de estruturas de concreto.\n- **NBR 6122:** Projeto e execução de fundações.\n- **NBR 9050:** Acessibilidade.\n- **NBR 15575:** Desempenho de edificações habitacionais.\n- **NBR 14653:** Avaliação de bens (Partes 1 a 7).\n- **NBR 13752:** Perícias de engenharia na construção civil.\n- **NBR 12721:** Avaliação de custos para incorporação imobiliária (CUB).\n\n---\n\n## 3. Política Urbana\n\n### Estatuto da Cidade (Lei 10.257/2001)\n- Regulamenta o desenvolvimento urbano (art. 182 e 183 da CF).\n- **Instrumentos:**\n  - Plano Diretor (obrigatório para cidades > 20 mil hab.).\n  - IPTU progressivo no tempo.\n  - Outorga Onerosa do Direito de Construir.\n  - EIV (Estudo de Impacto de Vizinhança).\n  - Operações Urbanas Consorciadas.\n  - Direito de Preempção.\n  - Usucapião Especial de Imóvel Urbano.\n\n### Novas Abordagens Urbanas\n- **Carta Brasileira das Cidades Inteligentes:** Integração tecnológica, sustentabilidade e inclusão digital na gestão urbana.\n- **HIS (Habitação de Interesse Social):** Foco em famílias de baixa renda, locação social, projetos de renda mista.\n- **Reurb (Lei 13.465/2017):** Regularização Fundiária Urbana.\n  - **Reurb-S:** Interesse Social (gratuito para baixa renda).\n  - **Reurb-E:** Interesse Específico (oneroso).\n  - **CRF:** Certidão de Regularização Fundiária.\n- **Urbanização de Favelas:** Regularização jurídica, infraestrutura básica e melhoria habitacional.\n\n---\n\n## 4. Infraestrutura e Políticas Nacionais\n- **Política Nacional de Saneamento Básico (Lei 11.445/2007 + Novo Marco Lei 14.026/2020).**\n- **Política Nacional de Resíduos Sólidos (Lei 12.305/2010):** Logística reversa, responsabilidade compartilhada, fim dos lixões.\n- **Política Nacional de Habitação (Lei 11.124/2005):** FNHIS.\n- **Política Nacional de Transportes:** Multimodalidade, integração.\n- **REIDI (Lei 11.488/2007):** Regime Especial de Incentivos para o Desenvolvimento da Infraestrutura (suspensão de PIS/PASEP e COFINS).\n- **DUP (Declaração de Utilidade Pública):** Para desapropriação e servidão em obras de energia elétrica.\n- **Segurança de Barragens (Lei 12.334/2010):** Política Nacional de Segurança de Barragens (PNSB). \n  - Classificação por Dano Potencial Associado (DPA) e Categoria de Risco (CRI).\n  - Plano de Ação de Emergência (PAE).\n\n> [!IMPORTANT]\n> A Lei 14.133/2021 é cobrança certa nas provas atuais. Estude profundamente o Diálogo Competitivo e os novos limites de dispensa de licitação.\n\n---\n\n### Checklist de Estudo\n- [ ] Revisar as modalidades da Lei 14.133/2021\n- [ ] Ler os instrumentos urbanísticos do Estatuto da Cidade\n- [ ] Compreender a diferença entre Reurb-S e Reurb-E\n- [ ] Decorar os limites de aditivos de contratos de obra\n- [ ] Revisar conceitos de Segurança de Barragens (DPA e CRI)\n"}, {"id": "18-discursiva", "title": "✍️ Prova Discursiva — Estratégia", "category": "Discursiva & Banca", "fileName": "18 - Prova Discursiva - Estratégia.md", "content": "---\ntags:\n  - discursiva\n  - redacao\n  - estrategia\n---\n\n# ✍️ Prova Discursiva — Estratégia e Preparação\n\n> [!IMPORTANT]\n> A prova discursiva vale **10 pontos** e é o **1º critério de desempate**. Subestimá-la pode custar sua classificação.\n\n## 1. Formato\n- 1 (uma) questão dissertativa em formato de estudo de caso, parecer técnico ou questão discursiva direta.\n- Tema extraído do conteúdo de **Conhecimentos Específicos de Engenharia Civil**.\n\n## 2. Critérios de Avaliação\n- Clareza, concisão, precisão e coerência na exposição de ideias.\n- **Domínio técnico:** Uso correto de conceitos, citação de normas da ABNT aplicáveis e legislação pertinente.\n- Capacidade de solucionar problemas ou redigir um parecer técnico conclusivo.\n- Correção gramatical, ortografia e pontuação (fator secundário em provas de engenharia, mas que gera perda de pontos).\n\n## 3. Hipóteses de Nota ZERO\n- Escrever a lápis na versão definitiva.\n- Assinar ou colocar marca identificadora fora do local apropriado.\n- Letra ilegível.\n- Escrever fora do espaço delimitado.\n- Fuga total do tema.\n\n## 4. Nota Mínima\n- Para não ser eliminado, é necessário obter no mínimo **6,0 pontos (60%)**.\n\n## 5. Estrutura Recomendada de Resposta\nPara um texto coeso e técnico, siga a estrutura:\n1. **Introdução:** Contextualize o problema apresentado no enunciado e apresente seu posicionamento técnico.\n2. **Desenvolvimento (1 a 3 parágrafos):** \n   - Fundamente sua análise tecnicamente.\n   - Cite explicitamente **Normas Técnicas (ABNT)**, Leis e Decretos.\n   - Mostre conhecimento da prática da engenharia aplicada ao caso.\n3. **Conclusão:** Síntese final com recomendações, parecer final de aprovação/rejeição ou solução definitiva para o problema.\n\n## 6. Temas Prováveis (Baseado no Edital da SEMA-MT)\nDado o perfil do órgão (Secretaria de Meio Ambiente), os temas tendem a ser interdisciplinares (Engenharia + Ambiental):\n- Licenciamento ambiental de obras civis e infraestrutura.\n- Saneamento básico e drenagem urbana.\n- Sustentabilidade na construção civil e certificações.\n- Orçamento, licitações (Lei 14.133) e fiscalização de obras públicas.\n- Segurança de barragens (muito forte para SEMA).\n- Avaliação de impacto ambiental em empreendimentos de engenharia.\n- Acessibilidade em edificações públicas (NBR 9050).\n- Hidráulica e hidrologia aplicadas à prevenção de desastres.\n\n## 7. Dicas de Redação Técnica\n- **Cite as NBRs pelo número:** Ex: \"De acordo com a NBR 9050...\", \"Conforme preconiza a NBR 15575...\".\n- **Cite Legislação:** Ex: \"Segundo a Lei 14.133/2021...\", \"Conforme a Política Nacional de Resíduos Sólidos (Lei 12.305/2010)...\".\n- Use terminologia técnica precisa (evite palavras vagas como \"coisa\", \"arrumar\", \"fazer\").\n- Estruture em parágrafos claros (um tópico frasal por parágrafo).\n- **NUNCA** ultrapasse o espaço delimitado para as linhas.\n\n## 8. Plano de Treino\n- **Frequência:** Fazer pelo menos **1 redação/parecer por semana**.\n- **Simulação:** Fazer a discursiva junto com um simulado de questões objetivas, medindo o tempo total e usando folha pautada.\n- **Correção:** Comparar o próprio texto com o padrão de resposta (espelho) de provas anteriores.\n\n---\n\n### Checklist de Estudo\n- [ ] Ler espelhos de correção de bancas em concursos anteriores (Cesgranrio, Cebraspe, FCC).\n- [ ] Memorizar os números das 10 principais NBRs.\n- [ ] Praticar a escrita de um \"Parecer Técnico\" com formatação adequada.\n- [ ] Fazer uma discursiva teste sobre \"Segurança de Barragens\".\n"}, {"id": "19-cesgranrio", "title": "🎓 Estratégia Banca Cesgranrio", "category": "Discursiva & Banca", "fileName": "19 - Estratégia para a Banca Cesgranrio.md", "content": "---\ntags:\n  - cesgranrio\n  - banca\n  - estrategia\n---\n\n# 🎓 Estratégia para a Banca Cesgranrio\n\n> [!NOTE]\n> Conhecer o perfil da banca é tão importante quanto dominar o conteúdo. A Cesgranrio possui um estilo próprio que exige estratégia específica.\n\n## 1. Perfil da Banca\n- Fundação Cesgranrio é uma banca tradicional, organiza provas de grandes estatais (Petrobras, Transpetro, Banco do Brasil, Caixa, BNDES) e recentemente o CNU.\n- Nível de dificuldade: Médio a Difícil (especialmente nas provas de Engenharia da Petrobras).\n- Padrão consistente ao longo dos anos.\n\n## 2. Características das Questões\n- **Múltipla escolha:** 5 alternativas (A, B, C, D, E).\n- **Enunciados:** Diretos, técnicos, com pouca enrolação, embora às vezes tragam pequenos \"cases\".\n- **Pegadinhas:** Menos comuns que na FGV, mas a banca exige precisão na terminologia. Se você não souber o conceito exato, as alternativas podem parecer todas plausíveis.\n- **Literalidade:** Muita cobrança literal de leis, decretos e itens específicos de normas da ABNT.\n\n## 3. Língua Portuguesa\n- Textos de tamanho médio.\n- Foco em reescrita de frases (mantendo o sentido e a correção).\n- Forte cobrança de gramática tradicional: pontuação, concordância verbal/nominal, regência, crase e colocação pronominal.\n- Exige estudo dedicado ao Manual de Redação da Presidência da República (quando no edital).\n\n## 4. Engenharia e Legislação Ambiental na Cesgranrio\n- **Normas ABNT:** São cobradas no detalhe (medidas, índices, tabelas). Não basta saber o conceito.\n- **Orçamento e Planejamento:** Muito cálculo de BDI, análise de curva ABC, interpretação de cronogramas Gantt, redes PERT-CPM e, agora, Lei 14.133/2021.\n- **Águas/Saneamento:** Questões costumam articular hidráulica pura com legislação ambiental e tecnologias de tratamento de efluentes.\n- **Estruturas/Geotecnia:** Cobram teoria de resistência dos materiais e aplicações normativas (NBR 6118, 6122).\n\n## 5. Inovações e Tendências Atuais\nO edital atual e o padrão recente da banca mostram inovações que devem ser priorizadas:\n- AVM (Avaliação em Massa) e uso de Machine Learning / IA em avaliações imobiliárias.\n- Sistemas de Energia Solar Fotovoltaica (componentes, eficiência).\n- BIM (Building Information Modeling).\n- Sustentabilidade e certificações (LEED, AQUA).\n\n## 6. Discursiva da Cesgranrio\n- Geralmente focada em um problema prático (estudo de caso ou parecer técnico).\n- Exige linguagem formal impecável e forte fundamentação normativa.\n- Valoriza soluções exequíveis e tecnicamente embasadas.\n\n## 7. Dicas Gerais e Gestão de Prova\n- **Tempo:** Gerencie bem as 5 horas para resolver todas as questões objetivas + discursiva + preencher o gabarito. (Média de 3 minutos por questão objetiva).\n- **Ordem de resolução:** Comece rascunhando ideias da discursiva, depois vá para as disciplinas de maior peso/facilidade. Deixe os cálculos pesados para o final.\n- **Chute:** Como não há desconto (não é modelo Certo/Errado do Cebraspe), **NUNCA deixe questão em branco**.\n\n> [!TIP]\n> A melhor preparação para a Cesgranrio é resolver exaustivamente questões anteriores da própria banca.\n\n---\n\n### Sugestão de Provas Anteriores para Praticar\n- Petrobras (Diversos anos) - Engenheiro Civil\n- Transpetro - Engenheiro Civil\n- BNDES - Profissional Básico Engenharia Civil\n- IBGE\n- EPE (Empresa de Pesquisa Energética)\n\n### Checklist de Estudo\n- [ ] Filtrar questões da Cesgranrio no QConcursos/TecConcursos (Engenharia Civil).\n- [ ] Resolver pelo menos 2 provas antigas da Petrobras na íntegra.\n- [ ] Mapear os \"assuntos favoritos\" da banca em Planejamento e Orçamento.\n- [ ] Treinar a leitura rápida de textos de Português.\n"}];

    // Setup Marked options
    marked.setOptions({
      gfm: true,
      breaks: true
    });

    mermaid.initialize({ startOnLoad: false, theme: 'default' });

    let currentDocIndex = 0;

    // Process markdown to convert Obsidian callouts and wikilinks
    function processMarkdown(md) {
      // Clean YAML frontmatter
      md = md.replace(/^---[\s\S]*?---\s*/m, '');

      // Replace Obsidian Wikilinks: [[Target|Label]] -> [Label](#/id)
      md = md.replace(/\[\[(.*?)\|(.*?)\]\]/g, function(match, p1, p2) {
        const found = DOCS.find(d => d.title.includes(p1.trim()) || d.fileName.includes(p1.trim()));
        const linkId = found ? found.id : '00-dashboard';
        return `[${p2.trim()}](#/${linkId})`;
      });

      md = md.replace(/\[\[(.*?)\]\]/g, function(match, p1) {
        const found = DOCS.find(d => d.title.includes(p1.trim()) || d.fileName.includes(p1.trim()));
        const linkId = found ? found.id : '00-dashboard';
        return `[${p1.trim()}](#/${linkId})`;
      });

      // Render Markdown to HTML first
      let html = marked.parse(md);

      // Process Callouts in HTML blockquotes
      html = html.replace(/<blockquote>\s*<p>\s*\[!NOTE\]\s*([\s\S]*?)<\/p>\s*<\/blockquote>/gi, '<div class="callout callout-note"><strong>ℹ️ NOTA:</strong> $1</div>');
      html = html.replace(/<blockquote>\s*<p>\s*\[!TIP\]\s*([\s\S]*?)<\/p>\s*<\/blockquote>/gi, '<div class="callout callout-tip"><strong>💡 DICA:</strong> $1</div>');
      html = html.replace(/<blockquote>\s*<p>\s*\[!WARNING\]\s*([\s\S]*?)<\/p>\s*<\/blockquote>/gi, '<div class="callout callout-warning"><strong>⚠️ ATENÇÃO:</strong> $1</div>');
      html = html.replace(/<blockquote>\s*<p>\s*\[!IMPORTANT\]\s*([\s\S]*?)<\/p>\s*<\/blockquote>/gi, '<div class="callout callout-important"><strong>❗ IMPORTANTE:</strong> $1</div>');
      html = html.replace(/<blockquote>\s*<p>\s*\[!CAUTION\]\s*([\s\S]*?)<\/p>\s*<\/blockquote>/gi, '<div class="callout callout-warning"><strong>🛑 CUIDADO:</strong> $1</div>');

      // Process Mermaid code blocks
      html = html.replace(/<pre><code class="language-mermaid">([\s\S]*?)<\/code><\/pre>/gi, '<div class="mermaid">$1</div>');

      return html;
    }

    // Render Sidebar
    function renderSidebar(filteredDocs = null) {
      const menu = document.getElementById('sidebarMenu');
      const docsToRender = filteredDocs || DOCS;
      
      const categories = {};
      docsToRender.forEach(doc => {
        if (!categories[doc.category]) categories[doc.category] = [];
        categories[doc.category].push(doc);
      });

      let html = '';
      for (const [category, items] of Object.entries(categories)) {
        html += `<div class="category-group">
          <div class="category-title">${category}</div>`;
        items.forEach(doc => {
          const isActive = DOCS[currentDocIndex] && DOCS[currentDocIndex].id === doc.id ? 'active' : '';
          html += `<a class="nav-item ${isActive}" onclick="loadDoc('${doc.id}')">${doc.title}</a>`;
        });
        html += `</div>`;
      }
      menu.innerHTML = html;
    }

    // Load Document
    async function loadDoc(id) {
      const index = DOCS.findIndex(d => d.id === id);
      if (index === -1) return;

      currentDocIndex = index;
      window.location.hash = '#/' + id;

      const doc = DOCS[index];
      const contentArea = document.getElementById('contentArea');
      contentArea.innerHTML = processMarkdown(doc.content);

      // Render Mermaid diagrams if present
      const mermaidDivs = contentArea.querySelectorAll('.mermaid');
      if (mermaidDivs.length > 0) {
        try {
          await mermaid.run({ nodes: mermaidDivs });
        } catch(e) {
          console.warn('Mermaid render warning:', e);
        }
      }

      // Update Navigation Buttons (Next / Prev)
      renderNavButtons();
      renderSidebar();

      // Scroll to top
      window.scrollTo({ top: 0, behavior: 'smooth' });

      // Close mobile sidebar if open
      document.getElementById('sidebar').classList.remove('open');
    }

    function renderNavButtons() {
      const navContainer = document.getElementById('docNav');
      let html = '';

      if (currentDocIndex > 0) {
        const prev = DOCS[currentDocIndex - 1];
        html += `<div class="doc-btn" onclick="loadDoc('${prev.id}')">
          <span class="doc-btn-label">← Anterior</span>
          <span class="doc-btn-title">${prev.title}</span>
        </div>`;
      } else {
        html += `<div></div>`;
      }

      if (currentDocIndex < DOCS.length - 1) {
        const next = DOCS[currentDocIndex + 1];
        html += `<div class="doc-btn" style="text-align: right; margin-left: auto;" onclick="loadDoc('${next.id}')">
          <span class="doc-btn-label">Próximo →</span>
          <span class="doc-btn-title">${next.title}</span>
        </div>`;
      }

      navContainer.innerHTML = html;
    }

    // Search filter
    document.getElementById('searchInput').addEventListener('input', function(e) {
      const term = e.target.value.toLowerCase().trim();
      if (!term) {
        renderSidebar();
        return;
      }
      const filtered = DOCS.filter(d => 
        d.title.toLowerCase().includes(term) || 
        d.content.toLowerCase().includes(term)
      );
      renderSidebar(filtered);
    });

    // Mobile menu toggle
    document.getElementById('menuToggle').addEventListener('click', function() {
      document.getElementById('sidebar').classList.toggle('open');
    });

    // Hash change handler for direct links
    window.addEventListener('hashchange', function() {
      const hash = window.location.hash.replace('#/', '');
      if (hash) {
        loadDoc(hash);
      }
    });

    // Initial load
    const initialHash = window.location.hash.replace('#/', '');
    if (initialHash && DOCS.some(d => d.id === initialHash)) {
      loadDoc(initialHash);
    } else {
      loadDoc('00-dashboard');
    }
  </script>
